<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Championnats – Comité du Var de Volley-Ball</title>
<meta name="description" content="Championnats M15 et M18 4x4 et tournois OPEN 2 contre 2 et 4 contre 4 du Comité du Var de Volley-Ball : calendriers, inscriptions en ligne et classements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B2149; --navy2: #14305f; --blue: #1E4FA3; --accent: #F6C21B;
    --bg: #F4F6FA; --card: #FFFFFF; --line: #E2E7F0; --line2: #EDF0F5;
    --text: #14203A; --muted: #56627A;
    --ok: #11672F; --ok-bg: #E7F6EC; --warn: #8A5A00; --warn-bg: #FFF4D6; --bad: #A3231D; --bad-bg: #FCE9E8;
    --fem: #9C2F6B; --fem-bg: #F8E8F1; --mas: #1E4FA3; --mas-bg: #E9EFFA; --open: #0E7C6B; --open-bg: #E3F4F1;
    --gold: #C9A227; --silver: #8E99A8; --bronze: #A8693A;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  [hidden] { display: none !important; }
  a { color: var(--blue); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  h1, h2, h3, .cond { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: .5px; color: var(--navy); }
  .muted { color: var(--muted); } .small { font-size: 13px; }

  header { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .head { display: flex; align-items: center; gap: 16px; min-height: 76px; }
  .head img { height: 48px; width: auto; display: block; }
  .head .sep { width: 1px; height: 36px; background: var(--line); }
  .head .t { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 24px; text-transform: uppercase; color: var(--navy); letter-spacing: .5px; }
  .head nav { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .navbtn { display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--text); font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .navbtn.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .navbtn.cta { background: var(--accent); border-color: var(--accent); color: var(--navy); font-weight: 700; }

  .hero { background: var(--navy); color: #fff; padding: 36px 0 40px; }
  .hero.open { background: linear-gradient(120deg, #0B2149 0%, #0E4F5C 100%); }
  .hero .k { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-size: 15px; margin-bottom: 8px; }
  .hero h1 { color: #fff; font-size: 46px; font-weight: 800; line-height: 1; }
  .hero p { color: #C9D4EA; margin-top: 12px; font-size: 16px; }
  .hero .btnrow { margin-top: 20px; }

  main.wrap { padding-top: 28px; padding-bottom: 64px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  .card h2 { font-size: 26px; font-weight: 800; line-height: 1.05; }
  .card h3 { font-size: 19px; font-weight: 800; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tab { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 22px; border: 1px solid var(--line); background: #fff; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--text); min-height: 44px; text-decoration: none; }
  .tab .sw { width: 10px; height: 10px; border-radius: 50%; }
  .tab.on { color: #fff; border-color: transparent; }
  .tab.F.on { background: var(--fem); } .tab.M.on { background: var(--mas); } .tab.O.on { background: var(--open); }
  .sw.F { background: var(--fem); } .sw.M { background: var(--mas); } .sw.O { background: var(--open); }

  .cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 980px) { .cols { grid-template-columns: minmax(0, 1fr); } }

  /* Classement */
  .rank-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 14px; }
  .tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  table.rank { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rank th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 9px 8px; border-bottom: 1px solid var(--line); background: #F8FAFD; text-align: center; white-space: nowrap; }
  .rank th.l, .rank td.l { text-align: left; }
  .rank td { padding: 9px 8px; border-bottom: 1px solid var(--line2); text-align: center; white-space: nowrap; }
  .rank tr:last-child td { border-bottom: 0; }
  .rank td.pts { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 20px; color: var(--navy); }
  .rank td.eq b { color: var(--navy); }
  .rank td.eq small { display: block; color: var(--muted); font-size: 12px; }
  .rank td.tp { color: var(--muted); font-size: 13px; }
  .rank td.tp.zero { color: #C3CAD6; }
  .pos { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 15px; font-weight: 800; background: #F1F4F9; color: var(--navy); }
  .pos.p1 { background: var(--gold); color: #fff; } .pos.p2 { background: var(--silver); color: #fff; } .pos.p3 { background: var(--bronze); color: #fff; }
  .medal { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; border-radius: 12px; font-size: 12px; font-weight: 800; }
  .medal.m1 { background: #FBF2D3; color: #8A6A08; } .medal.m2 { background: #EEF1F5; color: #4D5866; } .medal.m3 { background: #F6E8DD; color: #7A4520; }
  .medal.none { color: #C3CAD6; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-top: 12px; }
  .bareme { font-size: 13px; color: var(--muted); background: #F8FAFD; border-radius: 10px; padding: 10px 14px; margin-top: 12px; }

  /* Championnats fédéraux */
  .hero.fed { background: linear-gradient(120deg, #0B2149 0%, #1E4FA3 100%); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
  .seg-b { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; border-radius: 10px; text-decoration: none; color: var(--navy); font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .5px; text-align: center; line-height: 1.1; padding: 6px; }
  .seg-b span { font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .seg-b.on { background: var(--navy); color: #fff; } .seg-b.on span { color: #C9D4EA; }
  .fed-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line); background: #fff; font-weight: 700; font-size: 14px; color: var(--text); text-decoration: none; }
  .cat.on { background: var(--accent); border-color: var(--accent); color: var(--navy); }
  .monclub { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .monclub select { width: auto; max-width: 240px; padding: 8px 10px; font-size: 13px; }
  .ph { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: var(--blue); }
  .fedrank tr.mine td, .mt.mine, .equipes .mine { background: #FFF7DB !important; }
  .fedrank tr.mine td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
  .equipes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .equipes span { padding: 6px 12px; border-radius: 16px; background: #F4F6FA; font-size: 14px; font-weight: 600; }
  .sub-h { font-size: 15px; letter-spacing: 1px; color: var(--muted); margin: 14px 0 6px; }
  .jn { border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; background: #fff; }
  .jn summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 14px; }
  .jn summary::-webkit-details-marker { display: none; }
  .jn summary::before { content: '▸'; color: var(--muted); } .jn[open] summary::before { content: '▾'; }
  .jn summary b { color: var(--navy); } .jn summary span { font-size: 13px; color: var(--muted); }
  .mts { display: flex; flex-direction: column; border-top: 1px solid var(--line2); }
  .mt { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line2); }
  .mt:first-child { border-top: 0; }
  .mt-d { text-align: center; line-height: 1.05; align-self: center; }
  .mt-d b { display: block; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 22px; color: var(--navy); }
  .mt-d span { font-size: 11px; text-transform: uppercase; color: var(--muted); }
  .mt-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
  .mt-e { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mt-s { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 19px; color: var(--muted); min-width: 18px; text-align: right; line-height: 1.1; }
  .mt-row.win .mt-e { font-weight: 700; color: var(--navy); } .mt-row.win .mt-s { color: var(--navy); }
  .mt-i { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .chk-s { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .chk-s input { width: 16px; height: 16px; padding: 0; }
  .fedrank td.eq { white-space: normal; min-width: 120px; }
  .mt-row .mt-e:only-child { color: inherit; }
  @media (max-width: 760px) { .fedrank .hs2 { display: none; } }
  @media (max-width: 420px) { .fedrank td, .fedrank th { padding-left: 5px; padding-right: 5px; } .fedrank .pos { width: 26px; height: 26px; } }
  @media (max-width: 520px) { .fedrank .hs { display: none; } .seg-b { font-size: 16px; } .monclub { width: 100%; } .monclub select { flex: 1; max-width: none; } }

  .agenda-b { min-height: 44px; }
  .ag-list { display: flex; flex-direction: column; gap: 8px; }
  .ag { display: flex; flex-direction: column; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--text); }
  .ag:hover { border-color: var(--blue); background: #F4F7FD; }
  .ag b { color: var(--navy); } .ag span { font-size: 13px; color: var(--muted); }

  /* Week-end */
  .we { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; border-top: 5px solid var(--accent); }
  .we-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; }
  .we-k { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #9A7400; font-size: 14px; }
  .we h2 { font-size: 30px; font-weight: 800; line-height: 1; }
  .we-d { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 24px; color: var(--navy); text-transform: uppercase; }
  .we-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 14px; }
  .we-c { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 12px; text-decoration: none; color: var(--text); border: 1px solid var(--line); border-left: 6px solid var(--navy); background: #FAFBFD; }
  .we-c:hover { background: #F2F5FA; }
  .we-c.F { border-left-color: var(--fem); } .we-c.M { border-left-color: var(--mas); } .we-c.O { border-left-color: var(--open); }
  .we-cat { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; }
  .we-c.F .we-cat { color: var(--fem); } .we-c.M .we-cat { color: var(--mas); } .we-c.O .we-cat { color: var(--open); }
  .we-c b { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 24px; color: var(--navy); line-height: 1.1; }
  .we-l { font-size: 14px; font-weight: 600; }
  .we-s { font-size: 13px; color: var(--muted); } .we-s em { font-style: normal; color: var(--ok); font-weight: 600; }

  /* Calendrier */
  .cal { display: flex; flex-direction: column; }
  .cal-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line2); }
  .cal-row:first-child { border-top: 0; padding-top: 4px; }
  .cal-date { text-align: center; background: var(--navy); color: #fff; border-radius: 10px; padding: 7px 4px; line-height: 1.1; align-self: start; }
  .cal-date b { display: block; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 24px; }
  .cal-date span { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #C9D4EA; }
  .cal-date.past { background: #D5DBE5; } .cal-date.past span { color: #5E6A7E; } .cal-date.past b { color: #34405A; }
  .cal-t { font-weight: 800; color: var(--navy); font-size: 15px; }
  .cal-when { color: var(--blue); }
  .cal-meta { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .cal-meta b { color: var(--text); font-weight: 600; }
  .cal-act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 3px 10px; border-radius: 13px; font-size: 12px; font-weight: 700; line-height: 1.3; }
  .b-open { background: var(--ok-bg); color: var(--ok); } .b-closed { background: #EEF1F5; color: var(--muted); }
  .b-res { background: #FBF2D3; color: #7A5B05; } .b-wait { background: var(--warn-bg); color: var(--warn); } .b-tbc { background: #F4F6FA; color: var(--muted); }
  .cal-res { margin-top: 10px; }
  .cal-res summary { cursor: pointer; font-weight: 700; color: var(--blue); font-size: 14px; }
  .cal-res ol { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .cal-res li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; }
  .cal-res li .r { font-weight: 800; color: var(--muted); text-align: right; }
  .cal-res li .p { font-weight: 700; color: var(--navy); font-size: 13px; }

  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; font-weight: 700; font-size: 15px; font-family: inherit; cursor: pointer; text-decoration: none; }
  .btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
  .btn.primary { background: var(--navy); color: #fff; }
  .btn.accent { background: var(--accent); color: var(--navy); }
  .btn.ghost { background: #fff; border-color: var(--line); color: var(--text); }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.danger { background: #fff; border-color: #f2c4c1; color: var(--bad); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .linkbtn { background: none; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; font-family: inherit; font-size: 13px; padding: 4px 0; text-decoration: underline; }
  .linkbtn.red { color: var(--bad); }

  /* OPEN */
  .levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
  .level { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #FAFBFD; }
  .level b { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 18px; text-transform: uppercase; color: var(--open); }
  .level ul { margin: 6px 0 0 18px; font-size: 14px; color: var(--text); }
  .level li { margin-top: 4px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 18px; margin-top: 14px; }
  .fact { background: #F8FAFD; border-radius: 10px; padding: 10px 14px; }
  .fact b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .fact span { font-weight: 700; color: var(--navy); }

  /* Formulaires */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .lbl { font-size: 13px; font-weight: 700; }
  input, select, textarea { font-family: inherit; font-size: 15px; color: var(--text); background: #fff; border: 1px solid #C9D2E2; border-radius: 10px; padding: 11px 12px; outline: none; width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,79,163,.15); }
  textarea { min-height: 80px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .msg { border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.err { background: var(--bad-bg); color: var(--bad); } .msg.info { background: #E9EFFA; color: var(--navy); }
  .form { max-width: 760px; margin: 0 auto; }
  .step { display: flex; gap: 14px; padding: 18px 0; border-top: 1px solid var(--line2); }
  .step:first-of-type { border-top: 0; padding-top: 6px; }
  .step-n { flex: none; width: 32px; height: 32px; border-radius: 16px; background: var(--navy); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .step-b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .step-b h3 { font-size: 18px; }
  .tsum { background: #F8FAFD; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .tsum b { color: var(--navy); }
  .lines { display: flex; flex-direction: column; gap: 8px; }
  .line { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 110px 40px; gap: 8px; align-items: center; }
  .line .x { height: 44px; border-radius: 10px; border: 1px solid #f2c4c1; background: #fff; color: var(--bad); cursor: pointer; font-size: 16px; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid #C9D2E2; border-radius: 10px; overflow: hidden; width: max-content; }
  .stepper button { width: 48px; height: 48px; border: 0; background: #F4F6FA; font-size: 22px; font-weight: 700; cursor: pointer; color: var(--navy); }
  .stepper input { width: 70px; border: 0; border-radius: 0; text-align: center; font-size: 20px; font-weight: 800; padding: 0; height: 48px; }
  .hp { position: absolute; left: -5000px; }
  .done { text-align: center; padding: 36px 22px; }
  .done .big { font-size: 46px; }

  /* Saisie classement */
  .ed { display: flex; flex-direction: column; gap: 6px; }
  .ed-row { display: grid; grid-template-columns: 40px minmax(0, 1.4fr) minmax(0, 1fr) 54px 92px; gap: 8px; align-items: center; }
  .ed-row .n { font-weight: 800; color: var(--navy); text-align: center; }
  .ed-row .pp { font-weight: 700; color: var(--muted); text-align: center; font-size: 13px; }
  .ed-row .mv { display: flex; gap: 4px; }
  .ed-row .mv button { width: 28px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 12px; }
  .ed-row .mv button.x { color: var(--bad); border-color: #f2c4c1; }
  .ed-row input, .ed-row select { padding: 8px 10px; font-size: 14px; }
  .ed-h { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; }
  @media (max-width: 640px) { .ed-row { grid-template-columns: 30px minmax(0, 1fr) 40px; } .ed-row .club, .ed-row .ed-hc { display: none; } .ed-row .mv { grid-column: 2 / 4; } .ed-row .pp { display: none; } }

  /* Admin */
  .adm-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  table.adm { width: 100%; border-collapse: collapse; font-size: 13.5px; }

  .adm td { padding: 7px 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }

// « GYMNASE PIEMONTESI (OLLIOULES) » -> « Gymnase Piemontesi (Ollioules) »
const PETITS = new Set(['de', 'du', 'des', 'la', 'le', 'les', 'et', 'à', 'au', 'aux', 'sur', 'en', 'd', 'l']);
function lieuJoli(s) {
  return String(s || '').toLowerCase().replace(/[a-zà-ÿ]+/g, (w, i, all) => (i === 0 || !PETITS.has(w) || /[(\-]$/.test(all.slice(0, i))) ? w[0].toUpperCase() + w.slice(1) : w);
}
function matchHTML(m, ctx = {}) {
  const d = parseD(m.date), joue = m.sd != null;

  return `<div class="mt ${joue ? 'joue' : ''} ${estMien(m.dom) || estMien(m.ext) ? 'mine' : ''}">

      <div class="mt-i">${joue ? esc((m.sets || '').replace(/:/g, '-')) : [ctx.unJour ? '' : d ? cap(JOURS[d.getDay()]) : '', m.heure ? fmtH(m.heure) : '', !ctx.unLieu && m.lieu ? '📍 ' + lieuJoli(m.lieu) : ''].filter(Boolean).map(esc).join(' · ')}</div>

}

          <td class="l eq"><b>${esc(equipeFed(r.equipe))}</b>${r.f ? `<small style="color:var(--bad)">${r.f} forfait${r.f > 1 ? 's' : ''}</small>` : ''}</td>

// Ouverture automatique des inscriptions : 6 semaines avant le tournoi (même règle que chp_ouvert en SQL)
const OUVERTURE_JOURS = 42;
function ouverture(t) { const d = parseD(t.date); d.setDate(d.getDate() - OUVERTURE_JOURS); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// Date limite d'inscription : le jeudi précédant le tournoi
function jeudiAvant(s) { const d = parseD(s); let k = (d.getDay() + 3) % 7; if (!k) k = 7; d.setDate(d.getDate() - k); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// ----- Bandeau « les tournois du week-end » (page d'accueil) -----
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function prochainWeekend() {
  const next = D.tournois.filter(t => t.date >= today() && t.statut !== 'annule').sort((a, b) => a.date.localeCompare(b.date))[0];
  if (!next) return null;
  const d = parseD(next.date), dow = d.getDay();
  const sam = new Date(d); sam.setDate(d.getDate() - (dow === 0 ? 1 : dow === 6 ? 0 : -(6 - dow)));
  const dim = new Date(sam); dim.setDate(sam.getDate() + 1);
  const debut = iso(sam) < next.date ? iso(sam) : next.date, fin = iso(dim) > next.date ? iso(dim) : next.date;
  const ts = D.tournois.filter(t => t.date >= debut && t.date <= fin && t.statut !== 'annule').sort((a, b) => a.date.localeCompare(b.date) || String(a.heure || '').localeCompare(String(b.heure || '')) || comp(a.competition).ordre - comp(b.competition).ordre);
  const jours = Math.round((parseD(debut) - parseD(today())) / 864e5);
  return { ts, debut, fin, proche: jours <= 6 };
}
function weekendHTML() {
  const w = prochainWeekend(); if (!w) return '';
  const a = parseD(w.debut), b = parseD(w.fin);
  const dates = w.debut === w.fin ? fmtD(w.debut, true, false) : (a.getMonth() === b.getMonth() ? `${a.getDate()} et ${b.getDate()} ${MOIS[b.getMonth()]}` : `${fmtD(w.debut, false, false)} et ${fmtD(w.fin, false, false)}`);
  return `<section class="we">
    <div class="we-head"><div><div class="we-k">${w.proche ? 'Ce week\u2011end' : 'Prochain week\u2011end de tournois'}</div><h2>${w.proche ? 'Les tournois du week\u2011end' : 'Les prochains tournois'}</h2></div><span class="we-d">${esc(dates)}</span></div>
    <div class="we-list">${w.ts.map(t => { const c = comp(t.competition), k = kind(c), d = parseD(t.date); return `<a class="we-c ${k}" href="#${c.famille === 'open' ? 'open' : '4x4'}/${c.code}">
      <span class="we-cat">${esc(c.nom)}</span>
      <b>${JOURS[d.getDay()][0].toUpperCase() + JOURS[d.getDay()].slice(1)} ${d.getDate()}${t.heure ? ' · ' + esc(fmtH(t.heure)) : ''}</b>
      <span class="we-l">${t.lieu ? '📍 ' + esc(lieuTxt(t)) : 'Lieu à confirmer'}</span>
      <span class="we-s">${tNom(t)}${t.ouvert ? ` · <em>inscriptions jusqu'au ${esc(fmtD(t.date_limite, true, false))} ${esc(fmtH(t.heure_limite))}</em>` : t.nb_inscrits ? ` · ${t.nb_inscrits} équipe${t.nb_inscrits > 1 ? 's' : ''}` : ''}</span>
    </a>`; }).join('')}</div>
  </section>`;
}

function calRow(t, avecResultats) {
  const d = parseD(t.date), past = t.date < today();
  let badge;
  if (t.statut === 'annule') badge = '<span class="badge b-closed">Tournoi annulé</span>';
  else if (t.statut === 'valide') badge = '<span class="badge b-res">🏆 Résultats</span>';

  else if (t.ouvert) badge = `<span class="badge b-open">Inscriptions ouvertes${t.date_limite ? ' jusqu\'au ' + esc(fmtD(t.date_limite, false, false)) + (t.heure_limite ? ' ' + esc(fmtH(t.heure_limite)) : '') : ''}</span>`;
  else if (!t.date_limite && !t.lieu) badge = '<span class="badge b-tbc">Infos à venir</span>';
  else if (t.date_limite && today() < ouverture(t)) badge = `<span class="badge b-tbc">Inscriptions à partir du ${esc(fmtD(ouverture(t), false, false))}</span>`;
  else badge = '<span class="badge b-closed">Inscriptions closes</span>';
  const n = t.resultats ? t.resultats.length : 0;
  return `<div class="cal-row">
    <div class="cal-date ${past ? 'past' : ''}"><b>${d.getDate()}</b><span>${MOIS_C[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</span></div>

      <div class="cal-meta">${t.lieu ? `📍 <b>${esc(lieuTxt(t))}</b>` : 'Lieu à confirmer'}${t.organisateur ? ' · ' + esc(clubNom(t.organisateur)) : ''}</div>
      ${t.remarque ? `<div class="cal-meta">${esc(t.remarque)}</div>` : ''}

    </div>
  </div>`;
}

    </div>`;

}

// st = { rows:[{equipe, club}], connues:[noms], inscrits:[{club, nb}] }
function suggestions(st) {
  const s = new Set(st.connues || []);
  (st.inscrits || []).forEach(i => { for (let k = 1; k <= i.nb; k++) s.add((i.club + (i.nb > 1 ? ' ' + k : '')).toUpperCase()); });
  return [...s].sort(coll.compare);
}
function editorHTML(st, lock) {
  const n = st.rows.filter(r => r.equipe.trim()).length;
  return `<datalist id="dl-eq">${suggestions(st).map(x => `<option value="${esc(x)}">`).join('')}</datalist>
  <div class="ed">
    <div class="ed-row ed-h"><span>Rang</span><span>Équipe</span><span class="ed-hc">Club</span><span class="pp">Points</span><span></span></div>
    ${st.rows.map((r, i) => `<div class="ed-row" data-i="${i}">
      <span class="n">${i + 1}</span>
      <input data-f="equipe" list="dl-eq" value="${esc(r.equipe)}" placeholder="Nom de l'équipe" ${lock ? 'disabled' : ''} aria-label="Équipe classée ${i + 1}">
      <select class="club" data-f="club" ${lock ? 'disabled' : ''} aria-label="Club"><option value="">Club…</option>${D.clubs.map(c => `<option value="${esc(c.code)}" ${r.club === c.code ? 'selected' : ''}>${esc(c.nom)}</option>`).join('')}</select>
      <span class="pp">${r.equipe.trim() ? points(i + 1, n) : ''}</span>
      <span class="mv">${lock ? '' : `<button type="button" data-a="up" aria-label="Monter" ${i ? '' : 'disabled'}>▲</button><button type="button" data-a="down" aria-label="Descendre" ${i < st.rows.length - 1 ? '' : 'disabled'}>▼</button><button type="button" class="x" data-a="del" aria-label="Retirer">✕</button>`}</span>
    </div>`).join('')}
  </div>
  ${lock ? '' : '<div><button type="button" class="btn ghost sm" data-a="add">+ Ajouter une équipe</button></div>'}`;
}
function bindEditor(box, st, rerender) {
  box.querySelectorAll('.ed-row[data-i]').forEach(row => {
    const r = st.rows[+row.dataset.i];
    row.querySelectorAll('[data-f]').forEach(el => el.addEventListener('change', () => {
      r[el.dataset.f] = el.dataset.f === 'equipe' ? el.value.trim().toUpperCase() : el.value;
      if (el.dataset.f === 'equipe' && !r.club) { const g = D.clubs.find(c => r.equipe.startsWith(c.code.toUpperCase())); if (g) r.club = g.code; }
      st.dirty = true; rerender();
    }));
    row.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const i = +row.dataset.i;
      if (b.dataset.a === 'up') [st.rows[i - 1], st.rows[i]] = [st.rows[i], st.rows[i - 1]];
      if (b.dataset.a === 'down') [st.rows[i + 1], st.rows[i]] = [st.rows[i], st.rows[i + 1]];
      if (b.dataset.a === 'del') st.rows.splice(i, 1);
      st.dirty = true; rerender();
    });
  });
  const add = box.querySelector('[data-a="add"]');
  if (add) add.onclick = () => { st.rows.push({ equipe: '', club: '' }); st.dirty = true; rerender(); const ins = box.querySelectorAll('.ed-row[data-i] input'); if (ins.length) ins[ins.length - 1].focus(); };
}
const rowsOut = st => st.rows.filter(r => r.equipe.trim()).map((r, i) => ({ rang: i + 1, equipe: r.equipe.trim().toUpperCase(), club: r.club || null }));
function initialRows(resultats, inscrits) {
  if (resultats && resultats.length) return resultats.map(r => ({ equipe: r.equipe, club: r.club || '' }));
  const rows = [];
  (inscrits || []).forEach(i => { for (let k = 1; k <= i.nb; k++) rows.push({ equipe: (i.club + (i.nb > 1 ? ' ' + k : '')).toUpperCase(), club: D.clubs.some(c => c.code === i.club) ? i.club : '' }); });
  return rows.length ? rows : [{ equipe: '', club: '' }];
}

async function orgaOpen(t, code) {

function renderOrgaPanel() {
  const { data } = ORG, t = data.tournoi, c = data.competition, lock = t.statut === 'valide';

    </section>
    <section class="card stack">
      <div class="rank-head"><h2>Classement final du tournoi</h2>${{ ouvert: '<span class="badge b-tbc">À saisir</span>', saisi: '<span class="badge b-wait">Envoyé au Comité, en attente de validation</span>', valide: '<span class="badge b-res">Validé par le Comité</span>' }[t.statut]}</div>

      <div id="org-ed"></div>
      <div id="org-msg" class="msg" hidden></div>

  const aValider = A.tournois.filter(t => t.statut === 'saisi').length;
  $('app').innerHTML = `
  <div class="hero"><div class="wrap"><div class="k">Espace Comité</div><h1>Gestion des championnats</h1></div></div>
  <main class="wrap stack">
    <div class="rank-head"><div class="adm-tabs">${Object.entries(aTitre).map(([k, l]) => `<a class="tab ${k === ATAB ? 'on' : ''}" style="${k === ATAB ? 'background:var(--navy);color:#fff' : ''}" href="#admin/${k}">${l}${k === 'classements' && aValider ? ` <span class="badge b-wait">${aValider} à valider</span>` : ''}</a>`).join('')}</div>
      <span><span id="a-save" class="save"></span> <button class="linkbtn" onclick="ADMIN_PWD='';A=null;try{sessionStorage.removeItem('chp_admin')}catch(e){};location.hash='4x4'">Se déconnecter</button></span></div>
    <div id="a-body"></div>
  </main>`;
  ({ inscriptions: adminInscriptions, classements: adminClassements, tournois: adminTournois, clubs: adminClubs })[ATAB]();
}
const tSel = (list, cur, id = 'a-t') => `<select id="${id}" style="max-width:560px">${A.competitions.map(c => { const l = list.filter(t => t.competition === c.code); return l.length ? `<optgroup label="${esc(c.nom)}">${l.map(t => `<option value="${t.id}" ${t.id === cur ? 'selected' : ''}>${esc(c.nom)} · ${tNom(t)} · ${esc(fmtShort(t.date))}${t.ville ? ' · ' + esc(t.ville) : ''}${t.statut === 'saisi' ? ' · À VALIDER' : ''}</option>`).join('')}</optgroup>` : ''; }).join('')}</select>`;

// ----- Inscriptions -----
function adminInscriptions() {
  const ts = [...A.tournois].sort((a, b) => a.date.localeCompare(b.date));
  if (!ATID || !ts.find(t => t.id === ATID)) { const nx = ts.find(t => t.date >= today()); ATID = nx ? nx.id : ts.length ? ts[ts.length - 1].id : null; }
  const t = ts.find(x => x.id === ATID); if (!t) { $('a-body').innerHTML = '<div class="card">Aucun tournoi.</div>'; return; }
  const c = aComp(t.competition), open = c.famille === 'open';
  const ins = A.inscriptions.filter(i => i.tournoi_id === t.id);
  const total = ins.reduce((s, i) => s + i.nb_equipes, 0), clubs = [...new Set(ins.map(i => i.club))];
  const mails = [...new Set(ins.map(i => (i.contact_email || '').toLowerCase()).filter(Boolean))];
  const memeWE = ts.filter(x => Math.abs(parseD(x.date) - parseD(t.date)) <= 864e5);
  let matrice = '';
  if (open && ins.length) {
    const niv = c.niveaux || [], sx = SEXES_OPEN.filter(s => ins.some(i => i.sexe === s));
    matrice = `<div style="overflow-x:auto"><table class="mx"><thead><tr><th></th>${sx.map(s => `<th>${s}</th>`).join('')}<th>Total</th></tr></thead><tbody>${niv.map(n => `<tr><th>${esc(n)}</th>${sx.map(s => `<td>${ins.filter(i => i.niveau === n && i.sexe === s).reduce((a, i) => a + i.nb_equipes, 0) || ''}</td>`).join('')}<td><b>${ins.filter(i => i.niveau === n).reduce((a, i) => a + i.nb_equipes, 0)}</b></td></tr>`).join('')}</tbody></table></div>`;
  }
  $('a-body').innerHTML = `<div class="stack">
    <div class="card stack">
      <div class="field"><label for="a-t">Tournoi</label>${tSel(ts, t.id)}</div>
      <div class="muted small">${esc(fmtD(t.date, true))}${t.heure ? ' · ' + esc(fmtH(t.heure)) : ''} · ${t.lieu ? esc(lieuTxt(t)) : 'lieu à confirmer'} · ${t.ouvert ? `<span class="badge b-open">Inscriptions ouvertes${t.date_limite ? ' jusqu\'au ' + esc(fmtShort(t.date_limite)) + ' ' + esc(t.heure_limite || '') : ''}</span>` : '<span class="badge b-closed">Inscriptions closes</span>'}</div>
      <div class="kpis"><div class="kpi"><b>${total}</b><span>équipes</span></div><div class="kpi"><b>${clubs.length}</b><span>clubs</span></div><div class="kpi"><b>${mails.length}</b><span>adresses mail</span></div></div>
      ${matrice}
      <div class="btnrow" style="margin:0">
        <button class="btn primary" id="a-csv">⬇ Récapitulatif du tournoi (CSV)</button>
        ${memeWE.length > 1 ? `<button class="btn ghost" id="a-csv-we">⬇ Récapitulatif du week-end (${memeWE.length} tournois)</button>` : ''}
        <button class="btn ghost" id="a-copy" ${mails.length ? '' : 'disabled'}>📋 Copier les adresses mail</button>
        <a class="btn ghost" ${mails.length ? `href="https://mail.google.com/mail/?view=cm&fs=1&bcc=${encodeURIComponent(mails.join(','))}&su=${encodeURIComponent(tLabel(t) + ' – ' + fmtD(t.date, true))}" target="_blank" rel="noopener"` : 'aria-disabled="true" style="opacity:.5;pointer-events:none"'}>✉ Écrire aux inscrits (Gmail, en Cci)</a>
      </div>
      <textarea id="a-mails" readonly style="min-height:56px;font-size:13px" placeholder="Aucune adresse">${esc(mails.join(', '))}</textarea>
    </div>
    <div class="tablebox"><table class="adm">
      <thead><tr><th>Club</th>${open ? '<th>Niveau</th><th>Sexe</th>' : ''}<th>Équipes</th><th>Contact</th><th>Remarque</th><th>Reçue le</th><th></th></tr></thead>
      <tbody>${ins.length ? ins.map(i => `<tr data-id="${i.id}">
        <td><b>${esc(clubNom(i.club))}</b></td>
        ${open ? `<td><select data-f="niveau">${(c.niveaux || []).map(n => `<option ${i.niveau === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></td><td><select data-f="sexe">${SEXES_OPEN.map(n => `<option ${i.sexe === n ? 'selected' : ''}>${n}</option>`).join('')}</select></td>` : ''}
        <td><input data-f="nb_equipes" type="number" min="1" max="30" value="${i.nb_equipes}" style="width:70px"></td>
        <td>${esc(i.contact_nom || '')}<br><a href="mailto:${esc(i.contact_email || '')}">${esc(i.contact_email || '')}</a>${i.contact_tel ? '<br>' + esc(i.contact_tel) : ''}</td>
        <td class="small">${esc(i.commentaire || '')}</td>
        <td class="small muted">${esc(new Date(i.created_at).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }))}</td>
        <td><button class="linkbtn red" data-del>Supprimer</button></td></tr>`).join('') : `<tr><td colspan="8" class="muted">Aucune inscription pour ce tournoi.</td></tr>`}</tbody></table></div>
    <div class="btnrow" style="margin:0"><button class="btn ghost" id="a-csv-all">⬇ Toutes les inscriptions de la saison (CSV)</button></div>
  </div>`;
  $('a-t').onchange = () => { ATID = +$('a-t').value; adminInscriptions(); };
  const recap = list => list.flatMap(tt => A.inscriptions.filter(i => i.tournoi_id === tt.id).map(i => [aComp(tt.competition).nom, tt.numero, fmtShort(tt.date), lieuTxt(tt), clubNom(i.club), i.niveau || '', i.sexe || '', i.nb_equipes, i.contact_nom, i.contact_email, i.contact_tel, i.commentaire || '', new Date(i.created_at).toLocaleString('fr-FR')]));
  const head = ['Compétition', 'Tournoi', 'Date', 'Lieu', 'Club', 'Niveau', 'Sexe', 'Équipes', 'Contact', 'Mail', 'Téléphone', 'Remarque', 'Inscription le'];
  $('a-csv').onclick = () => csvDownload(`Inscriptions-${slug(aComp(t.competition).nom)}-T${t.numero}.csv`, head, recap([t]));
  if ($('a-csv-we')) $('a-csv-we').onclick = () => csvDownload(`Inscriptions-week-end-${t.date}.csv`, head, recap(memeWE));
  $('a-csv-all').onclick = () => csvDownload('Inscriptions-saison.csv', head, recap(ts));
  $('a-copy').onclick = async () => { try { await navigator.clipboard.writeText(mails.join(', ')); saveMark('ok', '✓ ' + mails.length + ' adresses copiées'); } catch(e) { $('a-mails').select(); document.execCommand('copy'); saveMark('ok', '✓ Copié'); } };
  $('a-body').querySelectorAll('tr[data-id]').forEach(tr => {
    const id = +tr.dataset.id;
    tr.querySelectorAll('[data-f]').forEach(el => el.onchange = async () => { saveMark('wait', 'Enregistrement…'); try { await rpc('chp_admin_inscription', { pwd: ADMIN_PWD, iid: id, p: { [el.dataset.f]: el.value } }); await loadAdmin(); saveMark('ok', '✓ Enregistré'); adminInscriptions(); } catch(e) { saveMark('err', '⚠ ' + e.message); } });
    tr.querySelector('[data-del]').onclick = async () => { if (!confirm('Supprimer cette inscription ?')) return; try { await rpc('chp_admin_inscription', { pwd: ADMIN_PWD, iid: id, p: null }); await loadAdmin(); adminInscriptions(); saveMark('ok', '✓ Supprimée'); } catch(e) { saveMark('err', '⚠ ' + e.message); } };
  });
}

// ----- Classements -----
function adminClassements() {
  const ts = A.tournois.filter(t => aComp(t.competition).famille === '4x4' && t.statut !== 'annule').sort((a, b) => (a.statut === 'saisi' ? 0 : 1) - (b.statut === 'saisi' ? 0 : 1) || a.date.localeCompare(b.date));
  if (!CTID || !ts.find(t => t.id === CTID)) { const s = ts.find(t => t.statut === 'saisi') || ts.filter(t => t.date <= today()).pop() || ts[0]; CTID = s && s.id; }
  const t = ts.find(x => x.id === CTID); if (!t) return;
  const res = A.resultats.filter(r => r.tournoi_id === t.id);
  const inscrits = A.inscriptions.filter(i => i.tournoi_id === t.id).map(i => ({ club: i.club, nb: i.nb_equipes }));
  const connues = [...new Set(A.resultats.filter(r => { const tt = A.tournois.find(x => x.id === r.tournoi_id); return tt && tt.competition === t.competition && tt.id !== t.id; }).map(r => r.equipe))];
  if (!AED || AED.tid !== t.id) AED = { tid: t.id, st: { rows: initialRows(res, inscrits), connues, inscrits } };
  const equipes = [...new Set(A.resultats.filter(r => { const tt = A.tournois.find(x => x.id === r.tournoi_id); return tt && tt.competition === t.competition; }).map(r => r.equipe))].sort(coll.compare);
  $('a-body').innerHTML = `<div class="stack">
    <div class="card stack">
      <div class="field"><label for="a-t">Tournoi</label>${tSel(ts, t.id)}</div>
      <div class="rank-head" style="margin:0"><span class="muted small">${esc(fmtD(t.date, true))} · ${t.lieu ? esc(lieuTxt(t)) : 'lieu à confirmer'} · code club recevant : <span class="code">${esc(t.code_orga || '—')}</span></span>
        ${{ ouvert: '<span class="badge b-tbc">Pas encore envoyé par le club</span>', saisi: '<span class="badge b-wait">Envoyé par le club : à vérifier</span>', valide: '<span class="badge b-res">Validé · compte au classement</span>' }[t.statut]}</div>
      <div id="a-ed"></div>
      <div class="btnrow" style="margin:0">
        <button class="btn ok" id="a-val">${t.statut === 'valide' ? 'Enregistrer les corrections' : 'Valider et publier le classement'}</button>
        <button class="btn ghost" id="a-brouillon">Enregistrer sans valider</button>
        ${t.statut === 'valide' ? '<button class="btn danger" id="a-reopen">Retirer du classement général</button>' : ''}
      </div>
    </div>
    ${equipes.length ? `<details class="card"><summary style="cursor:pointer;font-weight:700">Renommer ou fusionner une équipe (${esc(aComp(t.competition).nom)})</summary>
      <p class="small muted" style="margin:10px 0">Si une équipe apparaît sous deux noms, donnez-lui le même nom : ses points sont regroupés au classement général.</p>
      <div class="grid3"><select id="rn-old">${equipes.map(e => `<option>${esc(e)}</option>`).join('')}</select><input id="rn-new" placeholder="Nouveau nom" list="dl-rn"><datalist id="dl-rn">${equipes.map(e => `<option value="${esc(e)}">`).join('')}</datalist><button class="btn primary" id="rn-go">Renommer</button></div></details>` : ''}
  </div>`;
  const draw = () => { $('a-ed').innerHTML = editorHTML(AED.st, false); bindEditor($('a-ed'), AED.st, draw); };
  draw();
  $('a-t').onchange = () => { CTID = +$('a-t').value; AED = null; adminClassements(); };
  const save = async valider => {
    const rows = rowsOut(AED.st);
    if (valider && rows.length < 2) { saveMark('err', '⚠ Saisissez au moins deux équipes classées avant de valider'); return; }
    const dup = rows.map(r => r.equipe).find((x, i, a) => a.indexOf(x) !== i);
    if (dup) { saveMark('err', `⚠ « ${dup} » apparaît deux fois`); return; }
    saveMark('wait', 'Enregistrement…');
    try { await rpc('chp_admin_resultats', { pwd: ADMIN_PWD, tid: t.id, p_rows: rows, p_valider: valider }); await loadAdmin(); await loadPublic(); AED = null; adminClassements(); saveMark('ok', valider ? '✓ Classement validé et publié' : '✓ Enregistré'); }
    catch(e) { saveMark('err', '⚠ ' + e.message); }
  };
  $('a-val').onclick = () => save(true);
  $('a-brouillon').onclick = () => save(false);
  if ($('a-reopen')) $('a-reopen').onclick = async () => { if (!confirm('Retirer ce tournoi du classement général ? Le classement saisi est conservé.')) return; await rpc('chp_admin_save_tournoi', { pwd: ADMIN_PWD, t: { id: t.id, statut: 'saisi' } }); await loadAdmin(); await loadPublic(); AED = null; adminClassements(); };
  if ($('rn-go')) $('rn-go').onclick = async () => { const o = $('rn-old').value, n = $('rn-new').value.trim(); if (!n) return; if (!confirm(`Renommer « ${o} » en « ${n.toUpperCase()} » dans tous les tournois ?`)) return; try { const k = await rpc('chp_admin_renommer', { pwd: ADMIN_PWD, p_comp: t.competition, p_ancien: o, p_nouveau: n }); await loadAdmin(); await loadPublic(); AED = null; adminClassements(); saveMark('ok', `✓ ${k} résultat(s) renommé(s)`); } catch(e) { saveMark('err', '⚠ ' + e.message); } };
}

// ----- Calendrier et codes -----
function adminTournois() {
  if (!ACOMP) ACOMP = A.competitions[0].code;
  const c = aComp(ACOMP), ts = A.tournois.filter(t => t.competition === ACOMP).sort((a, b) => a.numero - b.numero);
  $('a-body').innerHTML = `<div class="stack">
    <div class="tabs">${A.competitions.map(x => `<button class="tab ${kind(x)} ${x.code === ACOMP ? 'on' : ''}" data-c="${x.code}"><span class="sw ${kind(x)}"></span>${esc(x.nom)}</button>`).join('')}</div>
    <p class="small muted">Les modifications sont enregistrées dès que vous quittez un champ. Inscriptions « Auto » : ouvertes 6 semaines avant le tournoi, jusqu'au jeudi précédent à 12 h (la date limite se recalcule quand vous changez la date du tournoi). ${c.famille === '4x4' ? 'Le code est à donner au club recevant, avec le lien de l\'espace club : <a href="' + SITE_URL + '#club" target="_blank">' + SITE_URL + '#club</a>.' : ''}</p>
    <div class="tablebox"><table class="adm"><thead><tr><th>N°</th><th>Date</th><th>Heure</th><th>Gymnase</th><th>Ville</th><th>Club recevant</th><th>Limite inscr.</th><th>Heure lim.</th><th>Inscriptions</th>${c.famille === '4x4' ? '<th>Code club</th>' : ''}<th>Annulé</th><th></th></tr></thead>
      <tbody>${ts.map(t => `<tr data-id="${t.id}">
        <td><input data-f="numero" type="number" value="${t.numero}" style="width:56px"></td>
        <td><input data-f="date" type="date" value="${esc(t.date)}"></td>
        <td><input data-f="heure" value="${esc(t.heure || '')}" placeholder="13:30" style="width:70px"></td>
        <td><input data-f="lieu" value="${esc(t.lieu || '')}" style="min-width:160px"></td>
        <td><input data-f="ville" value="${esc(t.ville || '')}" style="width:110px"></td>
        <td><select data-f="organisateur"><option value="">—</option>${A.clubs.map(k => `<option value="${esc(k.code)}" ${t.organisateur === k.code ? 'selected' : ''}>${esc(k.nom)}</option>`).join('')}</select></td>
        <td><input data-f="date_limite" type="date" value="${esc(t.date_limite || '')}"></td>
        <td><input data-f="heure_limite" value="${esc(t.heure_limite || '')}" style="width:64px"></td>
        <td><select data-f="inscriptions">${[['auto', 'Auto'], ['ouvertes', 'Forcer ouvertes'], ['fermees', 'Fermées']].map(([v, l]) => `<option value="${v}" ${t.inscriptions === v ? 'selected' : ''}>${l}</option>`).join('')}</select><div class="small ${t.ouvert ? '' : 'muted'}" style="margin-top:2px">${t.ouvert ? '● ouvertes' : 'closes'}</div></td>
        ${c.famille === '4x4' ? `<td style="white-space:nowrap"><input data-f="code_orga" class="code" value="${esc(t.code_orga || '')}" style="width:100px"> <button class="linkbtn" data-gen>Générer</button></td>` : ''}
        <td>${['ouvert', 'annule'].includes(t.statut) ? `<input type="checkbox" data-annule ${t.statut === 'annule' ? 'checked' : ''} style="width:18px;height:18px">` : '<span class="small muted">' + (t.statut === 'valide' ? 'joué' : 'saisi') + '</span>'}</td>
        <td><button class="linkbtn red" data-del>Supprimer</button></td></tr>`).join('')}</tbody></table></div>
    <div><button class="btn ghost" id="a-add">+ Ajouter un tournoi</button></div>
  </div>`;
  $('a-body').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { ACOMP = b.dataset.c; adminTournois(); });
  const put = async (id, p) => { saveMark('wait', 'Enregistrement…'); try { await rpc('chp_admin_save_tournoi', { pwd: ADMIN_PWD, t: { id, ...p } }); await loadAdmin(); await loadPublic(); saveMark('ok', '✓ Enregistré'); } catch(e) { saveMark('err', '⚠ ' + e.message); } };
  $('a-body').querySelectorAll('tr[data-id]').forEach(tr => {
    const id = +tr.dataset.id;
    tr.querySelectorAll('[data-f]').forEach(el => el.onchange = async () => {
      const p = { [el.dataset.f]: el.value };
      if (el.dataset.f === 'date' && el.value) { p.date_limite = jeudiAvant(el.value); p.heure_limite = '12:00'; }   // clôture : le jeudi d'avant à 12 h
      await put(id, p); if (['inscriptions', 'date_limite', 'date'].includes(el.dataset.f)) adminTournois();
    });
    const an = tr.querySelector('[data-annule]'); if (an) an.onchange = async () => { await put(id, { statut: an.checked ? 'annule' : 'ouvert' }); adminTournois(); };
    const g = tr.querySelector('[data-gen]'); if (g) g.onclick = async () => { const inp = tr.querySelector('[data-f="code_orga"]'); inp.value = ACOMP + '-' + Math.random().toString(36).slice(2, 6).toUpperCase().replace(/[O0I1L]/g, 'X'); await put(id, { code_orga: inp.value }); };
    tr.querySelector('[data-del]').onclick = async () => { if (!confirm('Supprimer ce tournoi, ses inscriptions et son classement ?')) return; await rpc('chp_admin_delete_tournoi', { pwd: ADMIN_PWD, tid: id }); await loadAdmin(); await loadPublic(); adminTournois(); };
  });
  $('a-add').onclick = async () => { const n = Math.max(0, ...ts.map(t => t.numero)) + 1, d = today(); await put(null, { competition: ACOMP, numero: n, date: d, date_limite: jeudiAvant(d), heure_limite: '12:00' }); adminTournois(); };
}

// ----- Clubs -----
function adminClubs() {
  $('a-body').innerHTML = `<div class="card stack" style="max-width:760px">
    <p class="small muted">Liste proposée dans le formulaire d'inscription. Le code court sert aussi de nom d'équipe par défaut (ex. « VCHPL 1 »).</p>
    <div class="tablebox"><table class="adm"><thead><tr><th>Code</th><th>Nom du club</th><th></th></tr></thead><tbody>
      ${A.clubs.map(k => `<tr data-code="${esc(k.code)}"><td class="code">${esc(k.code)}</td><td><input value="${esc(k.nom)}" data-nom></td><td><button class="linkbtn red" data-del>Supprimer</button></td></tr>`).join('')}
      <tr><td><input id="cl-code" placeholder="VCHPL" style="width:110px"></td><td><input id="cl-nom" placeholder="Nom du club"></td><td><button class="btn primary sm" id="cl-add">Ajouter</button></td></tr>
    </tbody></table></div></div>`;
  const put = async (code, nom) => { saveMark('wait', 'Enregistrement…'); try { await rpc('chp_admin_club', { pwd: ADMIN_PWD, p_code: code, p_nom: nom }); await loadAdmin(); saveMark('ok', '✓ Enregistré'); adminClubs(); } catch(e) { saveMark('err', '⚠ ' + e.message); } };
  $('a-body').querySelectorAll('tr[data-code]').forEach(tr => {
    tr.querySelector('[data-nom]').onchange = e => put(tr.dataset.code, e.target.value);
    tr.querySelector('[data-del]').onclick = () => confirm('Supprimer ce club de la liste ?') && put(tr.dataset.code, '');
  });
  $('cl-add').onclick = () => { const c = $('cl-code').value.trim(), n = $('cl-nom').value.trim(); if (c && n) put(c, n); };
}

// ======================== DÉMARRAGE ========================
(async function init() {
  try { await loadPublic(); }
  catch(e) { console.error(e); PUB_ERR = true; }
  try { const p = sessionStorage.getItem('chp_admin'); if (p) { A = await rpc('chp_admin_get', { pwd: p }); ADMIN_PWD = p; } } catch(e) { ADMIN_PWD = ''; }
  route();
})();
</script>
</body>
</html>
