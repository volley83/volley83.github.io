<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace Comité – Comité du Var de Volley-Ball</title>
<meta name="robots" content="noindex, nofollow">
<script src="/comite/session.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B2149; --navy2: #14305F; --navy3: #091B3D; --blue: #1E4FA3; --accent: #F6C21B;
    --bg: #F4F6FA; --card: #FFFFFF; --line: #E2E7F0; --line2: #EDF0F5; --lineN: #2B4A82;
    --text: #14203A; --muted: #56627A; --pale: #C9D4EA;
    --red: #B42318; --redbg: #FDECEA; --green: #1A7F45; --greenbg: #E6F4EC;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  a { color: var(--blue); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  h1, h2, h3, .cond { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: .5px; color: var(--navy); font-weight: 800; }
  .muted { color: var(--muted); } .small { font-size: 14px; }
  main { flex: 1 0 auto; padding: 28px 0 48px; }

  header { background: #fff; border-bottom: 1px solid var(--line); }
  .head { display: flex; align-items: center; gap: 16px; padding-top: 12px; padding-bottom: 12px; }
  .head img { height: 56px; width: auto; display: block; }
  .head .t { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; text-transform: uppercase; color: var(--navy); line-height: 1.02; font-size: 22px; }
  .head .t span { display: block; font-size: 15px; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
  .head .r { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #C5CEDD; background: #fff; color: var(--navy); font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--navy); }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.primary:hover { background: var(--navy2); }
  .btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }

  /* Connexion */
  .login { max-width: 440px; margin: 40px auto 0; }
  .login h1 { font-size: 30px; margin-bottom: 6px; }
  .field { margin-top: 18px; }
  .field label { display: block; font-weight: 700; margin-bottom: 6px; }
  .field input[type=password] { width: 100%; height: 50px; padding: 0 14px; border: 1px solid #C5CEDD; border-radius: 10px; font: inherit; font-size: 16px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin-top: 2px; flex: none; }
  .msg { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14.5px; }
  .msg.err { background: var(--redbg); color: var(--red); }
  .msg.info { background: #EAF0FB; color: var(--navy); }
  .login .btn.primary { width: 100%; margin-top: 18px; min-height: 50px; }

  /* Tableau de bord */
  .hello { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; margin-bottom: 22px; }
  .hello h1 { font-size: 40px; line-height: 1; }
  .hello p { margin-top: 6px; }
  h2.sec { font-size: 24px; margin: 30px 0 12px; display: flex; align-items: center; gap: 10px; }
  h2.sec:first-of-type { margin-top: 0; }

  .todo { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .todo a { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; background: #fff; border: 1px solid var(--line); color: var(--text); text-decoration: none; min-height: 76px; }
  .todo a:hover { border-color: var(--navy); }
  .todo .n { flex: none; min-width: 48px; height: 48px; padding: 0 8px; border-radius: 12px; display: grid; place-items: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; background: var(--line2); color: var(--muted); }
  .todo a.hot { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
  .todo a.hot .n { background: var(--accent); color: var(--navy); }
  .todo b { display: block; line-height: 1.25; }
  .todo span.s { font-size: 13.5px; color: var(--muted); }

  .soon { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .soon h3 { font-size: 19px; margin-bottom: 8px; }
  .soon ul { list-style: none; }
  .soon li { padding: 9px 0; border-top: 1px solid var(--line2); }
  .soon li:first-child { border-top: 0; padding-top: 0; }
  .soon .d { font-weight: 700; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--line2); color: var(--muted); }
  .tag.w { background: #FFF4D1; color: #7A5600; }
  .tag.r { background: var(--redbg); color: var(--red); }
  .tag.g { background: var(--greenbg); color: var(--green); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .tile { display: flex; gap: 14px; align-items: flex-start; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--text); }
  .tile:hover { border-color: var(--navy); }
  .tile .ic { flex: none; width: 44px; height: 44px; border-radius: 10px; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 22px; }
  .tile b { display: block; font-size: 16px; color: var(--navy); }
  .tile span.s { display: block; font-size: 13.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .tile.ext .ic { background: var(--line2); }

  footer { background: var(--navy); color: var(--pale); font-size: 14px; }
  footer .wrap { padding-top: 18px; padding-bottom: 18px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
  footer a { color: #fff; }

  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .head img { height: 44px; }
    .head .t { font-size: 19px; }
    .head .r .btn span { display: none; }
    .hello h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap head">
    <a href="/" aria-label="Accueil du site"><img src="../accueil/logo-comite-var.jpg" alt=""></a>
    <div class="t">Espace Comité<span>Comité du Var de Volley-Ball</span></div>
    <div class="r" id="head-btns" hidden>
      <a class="btn sm" href="/">🏠 <span>Site public</span></a>
      <button class="btn sm" type="button" id="logout">🔒 <span>Se déconnecter</span></button>
    </div>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>

<footer><div class="wrap">
  <span>Comité du Var de Volley-Ball · Espace réservé</span>
  <a href="/">Retour au site</a>
</div></footer>

<script>
const SUPABASE_URL = 'https://nssdhgpvkdbgdewsnlgl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GeMMc45mQbDOq-ZkU5vXZw_lYJe9KXf';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function rpc(fn, args) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {}),
  });
  const txt = await res.text();
  if (!res.ok) { let m = txt; try { m = JSON.parse(txt).message || txt; } catch (e) {} const err = new Error(m); err.status = res.status; throw err; }
  return txt ? JSON.parse(txt) : null;
}

/* ---------- Toutes les fonctions du Comité ---------- */
const GROUPES = [
  { titre: 'Compétitions et stages', items: [
    { ic: '🏐', nom: 'Championnats et OPEN', txt: 'Tournois OPEN et M15/M18 4x4, inscriptions, codes clubs, formules, classements', href: '../championnats/#admin' },
    { ic: '⭐', nom: "Pitchoun' Volley", txt: 'Plateaux, joueurs, validation des résultats, rappels aux clubs', href: '../pitchounvolley/#admin' },
    { ic: '🏆', nom: 'Tournoi International (TIP)', txt: 'Réglages du site, candidatures, saisie des résultats, archives', href: '../tip/#admin' },
    { ic: '🎓', nom: 'Stages', txt: 'Centre Départemental, beach-volley, stages d’été : convocations, réponses, paiements, reçus', href: '../stages/#admin' },
  ] },
  { titre: 'Gestion', items: [
    { ic: '🧾', nom: 'Facturation', txt: 'Bordereaux des clubs, factures, paiements, reçus de dons', href: '../facturation/' },
    { ic: '⚠️', nom: 'RIS – Infractions sportives', txt: 'Relevés, signalements des vérificateurs, personnes habilitées', href: '../facturation/#ris' },
    { ic: '🚗', nom: 'Frais de déplacement', txt: 'Notes de frais des bénévoles, intervenants et salariés', href: '../frais/' },
  ] },
  { titre: 'Site', items: [
    { ic: '📄', nom: 'Documents', txt: 'Ajouter, remplacer ou retirer les documents à télécharger', href: '../documents/#comite' },
    { ic: '🏠', nom: 'Clubs du Var', txt: 'Fiches des clubs : envoyer les liens, valider les fiches reçues', href: '../clubs/#comite' },
    { ic: '🌐', nom: 'Accueil du site', txt: 'Voir la page d’accueil publique (actualités, à venir)', href: '../accueil/' },
  ] },
  { titre: 'Outils', ext: true, items: [
    { ic: '🗄️', nom: 'Supabase', txt: 'Base de données : tables, scripts SQL, mot de passe du Comité (private_config)', href: 'https://supabase.com/dashboard/project/nssdhgpvkdbgdewsnlgl' },
    { ic: '💻', nom: 'GitHub volley83', txt: 'Fichiers des sites, robots (Facebook, résultats FFVB)', href: 'https://github.com/volley83' },
    { ic: '✉️', nom: 'Gmail du Comité', txt: 'Boîte volley83@gmail.com', href: 'https://mail.google.com/' },
  ] },
];

/* ---------- Connexion ---------- */
let PWD = '';
function vueLogin(msg) {
  $('head-btns').hidden = true;
  $('app').innerHTML = `
  <form class="card login" id="lg">
    <h1>Accès Comité</h1>
    <p class="muted">Saisissez le mot de passe du Comité. Il ouvre aussi toutes les parties du site (stages, championnats, Pitchoun', TIP, facturation, documents, clubs) sans avoir à le retaper.</p>
    <div class="field"><label for="pwd">Mot de passe du Comité</label><input type="password" id="pwd" autocomplete="current-password" required></div>
    <label class="check"><input type="checkbox" id="mem"><span>Rester connecté sur cet ordinateur<br><span class="small muted">À ne cocher que sur votre ordinateur personnel.</span></span></label>
    ${msg ? `<div class="msg err">${esc(msg)}</div>` : ''}
    <button class="btn primary" type="submit">Entrer</button>
  </form>`;
  $('pwd').focus();
  $('lg').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Vérification…';
    const ok = await entrer($('pwd').value, $('mem').checked);
    if (!ok) { btn.disabled = false; btn.textContent = 'Entrer'; }
  };
}

let RESUME = null, SANS_SQL = false;
async function verifier(pwd) {
  try { RESUME = await rpc('comite_resume', { pwd }); SANS_SQL = false; return true; }
  catch (e) {
    if (/refus/i.test(e.message)) return false;
    // Script SQL de l'Espace Comité pas encore lancé : on vérifie le mot de passe autrement
    if (e.status === 404 || /comite_resume|function/i.test(e.message)) {
      try { await rpc('doc_admin_get', { pwd }); RESUME = null; SANS_SQL = true; return true; }
      catch (e2) { if (/refus/i.test(e2.message)) return false; throw e2; }
    }
    throw e;
  }
}
async function entrer(pwd, remember) {
  try {
    if (!(await verifier(pwd))) { V83Session.logout(); vueLogin('Mot de passe incorrect.'); return false; }
    PWD = pwd; V83Session.save(pwd, remember);
    vueBord(); return true;
  } catch (e) { vueLogin('Connexion impossible : ' + e.message); return false; }
}
$('logout').onclick = () => { PWD = ''; RESUME = null; V83Session.logout(); vueLogin(); };

/* ---------- Tableau de bord ---------- */
const jour = iso => iso ? new Date(String(iso).slice(0, 10) + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const dans = iso => { const n = Math.round((new Date(String(iso).slice(0, 10) + 'T12:00:00') - new Date(new Date().toDateString() + ' 12:00')) / 864e5);
  return n < 0 ? 'en cours' : n === 0 ? "aujourd'hui" : n === 1 ? 'demain' : `dans ${n} jours`; };
const pl = (n, s, p) => n + ' ' + (n > 1 ? (p || s + 's') : s);

function blocTodo(R) {
  const items = [
    { k: 'signalements', t: 'Infractions signalées', s: 'à vérifier et intégrer au RIS', href: '../facturation/#ris' },
    { k: 'classements', t: 'Classements OPEN / 4x4', s: 'saisis par les clubs, à valider', href: '../championnats/#admin/classements' },
    { k: 'plateaux', t: "Plateaux Pitchoun'", s: 'résultats saisis, à valider', href: '../pitchounvolley/#admin' },
    { k: 'fiches_clubs', t: 'Fiches clubs', s: 'envoyées par les clubs, à valider', href: '../clubs/#comite' },
    { k: 'factures_impayees', t: 'Factures non réglées', s: 'envoyées, en attente de paiement', href: '../facturation/#factures' },
  ].filter(i => R[i.k] != null);
  if (!items.length) return '';
  const total = items.reduce((a, i) => a + (+R[i.k] || 0), 0);
  return `<h2 class="sec">À traiter ${total ? '' : '<span class="tag g" style="font-family:Inter;text-transform:none;letter-spacing:0">Tout est à jour ✓</span>'}</h2>
  <div class="todo">${items.map(i => { const n = +R[i.k] || 0;
    return `<a href="${i.href}" class="${n ? 'hot' : ''}"><span class="n">${n}</span><span><b>${esc(i.t)}</b><span class="s">${n ? esc(i.s) : 'rien en attente'}</span></span></a>`; }).join('')}</div>`;
}

function blocAVenir(R) {
  const cartes = [];
  if (R.stages) cartes.push(`<div class="card"><h3>🎓 Stages à venir</h3>${R.stages.length ? `<ul>${R.stages.map(s => {
    const lim = s.date_limite && s.sans_reponse ? ` · réponse avant le ${jour(s.date_limite)}` : '';
    return `<li><a href="../stages/#admin" class="d">${esc(s.titre)}</a><div class="small muted">${jour(s.date)} · ${dans(s.date)}${lim}</div>
      <div class="tags">${s.inscription
        ? `<span class="tag ${s.presents ? 'g' : ''}">${pl(s.presents, 'inscrit')}</span>${s.en_attente ? `<span class="tag w">${s.en_attente} en liste d'attente</span>` : ''}`
        : `<span class="tag">${pl(s.convoques, 'convoqué')}</span>${s.presents ? `<span class="tag g">${pl(s.presents, 'présent')}</span>` : ''}${s.sans_reponse ? `<span class="tag w">${s.sans_reponse} sans réponse</span>` : ''}`}${s.non_payes ? `<span class="tag r">${s.non_payes} non payé${s.non_payes > 1 ? 's' : ''}</span>` : ''}</div></li>`; }).join('')}</ul>`
    : '<p class="muted small">Aucun stage dans les 60 prochains jours.</p>'}</div>`);
  if (R.tournois) cartes.push(`<div class="card"><h3>🏐 Tournois OPEN et 4x4</h3>${R.tournois.length ? `<ul>${R.tournois.map(t =>
    `<li><a href="../championnats/#admin/inscriptions" class="d">${esc(t.competition)}</a><div class="small muted">${jour(t.date)} · ${dans(t.date)}${t.lieu ? ' · ' + esc(t.lieu) : ''}</div>
      <div class="tags"><span class="tag ${t.equipes ? 'g' : ''}">${t.equipes ? pl(t.equipes, 'équipe inscrite', 'équipes inscrites') : 'aucune inscription'}</span></div></li>`).join('')}</ul>`
    : '<p class="muted small">Aucun tournoi dans les 30 prochains jours.</p>'}</div>`);
  if ('prochain_plateau' in R) { const p = R.prochain_plateau;
    cartes.push(`<div class="card"><h3>⭐ Pitchoun' Volley</h3>${p ? `<ul><li><a href="../pitchounvolley/#admin" class="d">Prochain plateau</a><div class="small muted">${jour(p.date)}${p.heure ? ' à ' + esc(p.heure) : ''} · ${dans(p.date)}</div><div class="small">${esc([p.lieu, p.ville].filter(Boolean).join(', '))}</div></li></ul>` : '<p class="muted small">Aucun plateau programmé.</p>'}</div>`); }
  return cartes.length ? `<h2 class="sec">À venir</h2><div class="soon">${cartes.join('')}</div>` : '';
}

function vueBord() {
  $('head-btns').hidden = false;
  const R = RESUME || {};
  const h = new Date().getHours();
  $('app').innerHTML = `
  <div class="hello"><div><h1>${h < 18 ? 'Bonjour' : 'Bonsoir'} !</h1><p class="muted">Toutes les fonctions du Comité. Vous êtes connecté partout : chaque lien s'ouvre directement sur l'espace de gestion.</p></div>
    <button class="btn sm" type="button" onclick="actualiser(this)">↻ Actualiser</button></div>
  ${SANS_SQL ? `<div class="msg info" style="margin:0 0 20px">Les compteurs « À traiter » et « À venir » apparaîtront après le lancement du script <b>sql/comite/supabase-comite.sql</b> dans Supabase (SQL Editor).</div>` : ''}
  ${blocTodo(R)}
  ${blocAVenir(R)}
  ${GROUPES.map(g => `<h2 class="sec">${esc(g.titre)}</h2><div class="tiles">${g.items.map(i =>
    `<a class="tile ${g.ext ? 'ext' : ''}" href="${i.href}"${g.ext ? ' target="_blank" rel="noopener"' : ''}><span class="ic" aria-hidden="true">${i.ic}</span><span><b>${esc(i.nom)}${g.ext ? ' ↗' : ''}</b><span class="s">${esc(i.txt)}</span></span></a>`).join('')}</div>`).join('')}
  <p class="small muted" style="margin-top:26px">La page des vérificateurs (<a href="../ris/">volley83.github.io/ris</a>) fonctionne avec leurs codes personnels, pas avec le mot de passe du Comité. Les codes se gèrent dans Facturation › RIS.</p>`;
}
async function actualiser(btn) {
  btn.disabled = true;
  try { if (await verifier(PWD)) vueBord(); else { V83Session.logout(); vueLogin('Le mot de passe du Comité a changé : reconnectez-vous.'); } }
  catch (e) { alert('Actualisation impossible : ' + e.message); btn.disabled = false; }
}

/* ---------- Démarrage ---------- */
(async () => {
  const p = V83Session.get();
  if (!p) return vueLogin();
  $('app').innerHTML = '<p class="muted">Connexion…</p>';
  try {
    if (await verifier(p)) { PWD = p; V83Session.save(p, V83Session.remembered()); vueBord(); }
    else { V83Session.logout(); vueLogin('Le mot de passe du Comité a changé : reconnectez-vous.'); }
  } catch (e) { vueLogin('Connexion impossible : ' + e.message); }
})();
</script>
</body>
</html>
