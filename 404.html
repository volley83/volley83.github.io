<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page introuvable – Comité du Var de Volley-Ball</title>
<script>
// Anciennes adresses du site Sportsregions (volley83.fr) → nouvelles pages.
(function () {
  var p = decodeURIComponent(location.pathname).toLowerCase();
  var regles = [
    [/document|reglement|règlement|formulaire|feuille|telecharg/, '/documents/'],
    [/club|annuaire|carte/, '/clubs/'],
    [/stage|centre|selection|sélection|detection|détection|cde/, '/stages/'],
    [/pitchoun|baby|ecole|école/, '/pitchounvolley/'],
    [/tip|international|poussin/, '/tip/'],
    [/champion|competition|compétition|resultat|résultat|classement|calendrier|open|4x4|coupe|tournoi/, '/championnats/'],
    [/actualit|news|article|evenement|événement|agenda/, '/#actualites'],
    [/contact|comite|comité|bureau|organigramme|presentation|présentation/, '/#contact']
  ];
  for (var i = 0; i < regles.length; i++) {
    if (regles[i][0].test(p)) { location.replace(regles[i][1]); return; }
  }
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #F4F6FA; color: #14203A; text-align: center; padding: 16px; }
  .c { max-width: 460px; background: #fff; border-radius: 16px; padding: 28px 24px; box-shadow: 0 4px 18px rgba(11,33,73,.08); }
  img { width: 170px; height: auto; }
  h1 { font-size: 22px; color: #0B2149; margin: 16px 0 8px; }
  p { color: #3F4B63; line-height: 1.5; }
  a.b { display: inline-block; margin-top: 10px; background: #0B2149; color: #fff; text-decoration: none; font-weight: 700; padding: 10px 18px; border-radius: 10px; }
</style>
</head>
<body>
<div class="c">
  <img src="/accueil/logo-comite-var.jpg" alt="Comité du Var de Volley-Ball">
  <h1>Cette page n'existe plus</h1>
  <p>Le site du Comité a changé. Vous retrouverez toutes les informations depuis la page d'accueil.</p>
  <a class="b" href="/">Aller à l'accueil</a>
</div>
</body>
</html>
