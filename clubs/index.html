<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clubs du Var – Comité du Var de Volley-Ball</title>
<meta name="description" content="Les clubs de volley-ball du Var : villes, gymnases, catégories accueillies et contacts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0B2149; --blue: #1E4FA3; --accent: #F6C21B; --bg: #F4F6FA; --line: #E2E7F0; --text: #14203A; --muted: #56627A;
    --ok: #11672F; --ok-bg: #E7F6EC; --warn: #8A5A00; --warn-bg: #FFF4D6; --bad: #A3231D; --bad-bg: #FCE9E8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
  [hidden] { display: none !important; }
  a { color: var(--blue); } a:hover { color: var(--navy); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 24px; }
  header { background: #fff; border-bottom: 1px solid var(--line); }
  .head { display: flex; align-items: center; gap: 14px; padding-top: 10px; padding-bottom: 10px; }
  .head img { height: 48px; display: block; }
  .head .t { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: .5px; color: var(--navy); line-height: 1; }
  .head .t { flex: 1 1 auto; min-width: 0; }
  .head .back { font-weight: 600; font-size: 14px; text-align: right; display: inline-flex; align-items: center; min-height: 44px; }
  main.wrap { padding-top: 26px; padding-bottom: 56px; display: flex; flex-direction: column; gap: 18px; }
  h1, h2, h3 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; color: var(--navy); letter-spacing: .5px; font-weight: 800; }
  h1 { font-size: 36px; line-height: 1; } h2 { font-size: 24px; } h3 { font-size: 19px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  label, .lab { font-size: 14px; font-weight: 700; }
  .req { color: var(--bad); }
  input, select, textarea { font-family: inherit; font-size: 16px; color: var(--text); background: #fff; border: 1px solid #C9D2E2; border-radius: 10px; padding: 10px 12px; width: 100%; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,79,163,.15); }
  textarea { min-height: 84px; resize: vertical; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .g3 { display: grid; grid-template-columns: 2fr 1fr 1.4fr; gap: 12px; }
  @media (max-width: 620px) { .g2, .g3 { grid-template-columns: 1fr; } .head .t { font-size: 22px; } h1 { font-size: 30px; } }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; font-weight: 700; font-size: 15px; font-family: inherit; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--navy); color: #fff; } .btn.ghost { background: #fff; border-color: #C9D2E2; color: var(--text); } .btn.red { background: #fff; border-color: #E5B5B2; color: var(--bad); }
  .btn.sm { min-height: 38px; padding: 0 12px; font-size: 13px; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .msg { border-radius: 10px; padding: 12px 14px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.err { background: var(--bad-bg); color: var(--bad); } .msg.info { background: #E9EFFA; color: var(--navy); } .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .linkbtn { background: none; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; font-family: inherit; font-size: 14px; text-decoration: underline; padding: 0; min-height: 32px; }
  .linkbtn.red { color: var(--bad); }
  .badge { display: inline-flex; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .b-new { background: var(--warn-bg); color: var(--warn); } .b-ok { background: var(--ok-bg); color: var(--ok); } .b-no { background: #EEF1F5; color: #3F4B63; }
  .chk { display: flex; gap: 9px; align-items: flex-start; font-weight: 500; font-size: 14px; cursor: pointer; }
  .chk input { width: 18px; height: 18px; flex: 0 0 18px; margin-top: 2px; }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 14px; }
  .lieu { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #FAFBFD; display: flex; flex-direction: column; gap: 10px; }
  .lieu .top { display: flex; justify-content: space-between; align-items: center; }
  .logobox { width: 120px; height: 120px; border: 1px dashed #9FB3D9; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--muted); font-size: 12px; text-align: center; flex: 0 0 120px; }
  .logobox img { max-width: 100%; max-height: 100%; }

  /* Annuaire public */
  .card.filtres { flex-direction: row; flex-wrap: wrap; gap: 12px; }
  .filtres .field { flex: 1 1 240px; }
  .liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 16px; align-items: stretch; grid-auto-flow: dense; }
  .club.ouvert { grid-column: 1 / -1; }   /* une fiche dépliée prend toute la ligne : les autres gardent des hauteurs égales */
  .club { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .club .tete { display: flex; gap: 14px; align-items: center; }
  .club .lg { width: 76px; height: 76px; flex: 0 0 76px; border-radius: 12px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 20px; color: var(--navy); }
  .club .lg img { max-width: 100%; max-height: 100%; }
  .club h2 { font-size: 24px; line-height: 1.05; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 10px; border-radius: 14px; background: #E9EFFA; color: #17407F; font-size: 12px; font-weight: 700; }
  .lbl { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 16px; font-size: 14px; font-weight: 700; border: 1px solid transparent; }
  .lbl svg { flex: 0 0 auto; }
  .club .plus { display: flex; flex-direction: column; gap: 12px; }
  .club .tog { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #C9D2E2; background: #fff; color: var(--navy); font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
  .club .tog:hover { border-color: var(--navy); }
  .club .tog[aria-expanded="true"] svg { transform: rotate(180deg); }
  .lbl.or { background: #FFF1C2; color: #5E4500; border-color: #E7C65A; } .lbl.argent { background: #ECEFF3; color: #3A4558; border-color: #BFC7D4; } .lbl.bronze { background: #F6E3D3; color: #6F3C13; border-color: #D9A77E; }
  .club .bloc { border-top: 1px solid #EDF0F5; padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .club .bloc b.t { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .pre { white-space: pre-line; overflow-wrap: anywhere; }
  .contacts { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .contacts a { display: inline-flex; align-items: center; min-height: 36px; font-weight: 600; overflow-wrap: anywhere; }
  .autres ul { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 0 24px; }
  .autres li { padding: 8px 0; border-bottom: 1px solid #EDF0F5; }
  .carte-wrap { padding: 0; overflow: hidden; gap: 0; }
  #carte { height: 440px; width: 100%; background: #E9EFFA; z-index: 0; }
  @media (max-width: 620px) { #carte { height: 300px; } }
  .carte-pied { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; padding: 8px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .leaflet-popup-content { margin: 12px 14px; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.4; }
  .pop { display: flex; flex-direction: column; gap: 4px; min-width: 190px; }
  .pop .n { display: flex; gap: 8px; align-items: center; font-weight: 700; color: var(--navy); }
  .pop .n img { width: 34px; height: 34px; object-fit: contain; flex: 0 0 34px; }
  .pop button { margin-top: 6px; align-self: flex-start; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--navy); color: #fff; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
  .club.vise { box-shadow: 0 0 0 3px rgba(246,194,27,.6); border-color: var(--accent); }
  footer { border-top: 1px solid var(--line); background: #fff; }
  footer .wrap { padding-top: 14px; padding-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 20px; justify-content: space-between; font-size: 13px; color: var(--muted); }
  /* Comité */
  .adm { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; border-top: 1px solid #EDF0F5; padding-top: 12px; }
  .adm:first-of-type { border-top: 0; padding-top: 0; }
  @media (max-width: 760px) { .adm { grid-template-columns: 1fr; } }
</style>

<body>
<header><div class="wrap head">
  <a href="../accueil/" aria-label="Accueil du Comité"><img src="logo-comite-var.jpg" alt=""></a>
  <div class="t">Clubs du Var</div>
  <a class="back" href="../accueil/">← Accueil</a>
</div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap"><span>Comité du Var de Volley-Ball · <a href="mailto:volley83@gmail.com">volley83@gmail.com</a></span><a href="#comite">Accès Comité</a></div></footer>

<script>
const SUPABASE_URL = 'https://nssdhgpvkdbgdewsnlgl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GeMMc45mQbDOq-ZkU5vXZw_lYJe9KXf';
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(fn, args) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
  const txt = await res.text();
  if (!res.ok) { let m = txt; try { m = JSON.parse(txt).message || txt; } catch(e) {} throw new Error(m); }
  return txt ? JSON.parse(txt) : null;
}
const fmtD = s => s ? new Date(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

/* ---------- Catégories proposées aux clubs (l'identifiant ne doit plus changer une fois des fiches remplies) ---------- */
const CATS = [
  ['baby', 'Baby volley (3-6 ans)'], ['ecole', 'École de volley (M7 à M11)'], ['m13', 'M13'], ['m15', 'M15'], ['m18', 'M18'], ['m21', 'M21'],
  ['senf', 'Seniors féminines'], ['senm', 'Seniors masculins'], ['loisir', "Loisir / Compet'Lib"], ['beach', 'Beach-volley'],
  ['sante', 'Volley santé / soft volley'], ['assis', 'Volley assis']
];
/* ---------- Labels fédéraux (FFvolley) : un niveau par label ---------- */
const LABELS = [['formateur', 'Club Formateur'], ['sante', 'Volley Santé'], ['assis', 'Volley Assis']];
const NIVEAUX = [['or', 'Or'], ['argent', 'Argent'], ['bronze', 'Bronze']];
const labelsDe = f => LABELS.map(([k, t]) => { const n = NIVEAUX.find(x => x[0] === ((f && f.labels) || {})[k]); return n ? { k, t, n } : null; }).filter(Boolean);
const MAX_LIEUX = 5;
const EN_TETE = ['GSD83'];     // structures affichées en premier dans l'annuaire, avant les clubs (demande de Clément du 18/11/2026)
// N'accepte que de vraies adresses web (http ou https, avec un nom de domaine) : tout le reste est ignoré
const lienWeb = u => {
  u = String(u || '').trim(); if (!u || /\s/.test(u)) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) && /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(x.hostname) ? x.href : ''; } catch (e) { return ''; }
};
const logoOk = l => typeof l === 'string' && /^data:image\/(png|jpeg|webp);base64,/.test(l);

/* =====================================================================
   1. ANNUAIRE PUBLIC
   ===================================================================== */
let CLUBS = [];
function carteClub(c) {
  const f = c.fiche || {}, cats = CATS.filter(([k]) => (f.categories || []).includes(k));
  const lieux = (f.lieux || []).filter(l => l && (l.nom || l.adresse || l.ville)), labs = labelsDe(f);
  const contacts = [];
  if (f.email) contacts.push(`<a href="mailto:${esc(f.email)}">${esc(f.email)}</a>`);
  if (f.tel) contacts.push(`<a href="tel:${esc(String(f.tel).replace(/[^\d+]/g, ''))}">${esc(f.tel)}</a>`);
  [['site', 'Site internet'], ['facebook', 'Facebook'], ['instagram', 'Instagram']].forEach(([k, t]) => { const u = lienWeb(f[k]); if (u) contacts.push(`<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`); });
  const details = !!(f.presentation || lieux.length || contacts.length || f.contact_nom);
  return `<article class="club" id="club-${esc(c.code)}">
    <div class="tete">
      <div class="lg">${logoOk(c.logo) ? `<img src="${esc(c.logo)}" alt="">` : esc(c.code)}</div>
      <div><h2>${esc(c.nom)}</h2>${f.villes ? `<div class="muted">${esc(f.villes)}</div>` : ''}</div>
    </div>
    ${c.fiche ? '' : '<div class="muted small">Fiche à venir.</div>'}
    ${labs.length ? `<div class="chips" aria-label="Labels fédéraux">${labs.map(l => `<span class="lbl ${l.n[0]}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/></svg>Label ${esc(l.t)} · ${esc(l.n[1])}</span>`).join('')}</div>` : ''}
    ${cats.length ? `<div class="chips">${cats.map(([, t]) => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
    ${details ? `<button type="button" class="tog" aria-expanded="false" aria-controls="det-${esc(c.code)}">Voir la présentation, les gymnases et le contact <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="plus" id="det-${esc(c.code)}" hidden>
    ${f.presentation ? `<p class="pre">${esc(f.presentation)}</p>` : ''}
    ${lieux.length ? `<div class="bloc"><b class="t">Où jouer</b>${lieux.map(l => {
      const adr = [l.adresse, [l.cp, l.ville].filter(Boolean).join(' ')].filter(Boolean).join(', ');
      return `<div><b>${esc(l.nom || 'Lieu de pratique')}</b>${adr ? ` · ${esc(adr)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([l.nom, adr].filter(Boolean).join(', '))}" target="_blank" rel="noopener">Itinéraire</a>` : ''}${l.creneaux ? `<div class="pre muted small">${esc(l.creneaux)}</div>` : ''}</div>`;
    }).join('')}</div>` : ''}
    ${contacts.length || f.contact_nom ? `<div class="bloc"><b class="t">Contact</b>${f.contact_nom ? `<div>${esc(f.contact_nom)}${f.contact_role ? ` <span class="muted">· ${esc(f.contact_role)}</span>` : ''}</div>` : ''}<div class="contacts">${contacts.join('')}</div></div>` : ''}
    </div>` : ''}
  </article>`;
}
function filtrer() {
  const q = ($('q').value || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''), cat = $('cat').value;
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const l = CLUBS.filter(c => {
    const f = c.fiche || {};
    if (cat && !(f.categories || []).includes(cat)) return false;
    if (!q) return true;
    return norm([c.nom, c.code, f.villes, ...(f.lieux || []).map(x => x.ville)].join(' ')).includes(q);
  });
  // Fiches remplies d'abord (ordre alphabétique, structures particulières comme le GSD à la fin), puis les autres clubs en liste compacte
  // (l'ordre de la base est alphabétique ; les structures de EN_TETE, comme le GSD, passent devant les clubs)
  const rang = c => { const i = EN_TETE.indexOf(c.code); return i < 0 ? EN_TETE.length : i; };
  const l2 = l.map((c, i) => [c, i]).sort((a, b) => rang(a[0]) - rang(b[0]) || a[1] - b[1]).map(x => x[0]);
  const avec = l2.filter(c => c.fiche), sans = l2.filter(c => !c.fiche);
  $('liste').innerHTML = avec.length ? avec.map(carteClub).join('') : (sans.length ? '' : '<div class="msg info">Aucun club ne correspond à cette recherche.</div>');
  $('autres').hidden = !sans.length;
  $('autres-titre').textContent = avec.length ? 'Autres clubs du Var' : 'Clubs du Var';
  $('autres-liste').innerHTML = sans.map(c => `<li><b>${esc(c.nom)}</b> <span class="muted">· ${esc(c.code)}</span></li>`).join('');
  majCarte(avec);
}

/* ---------- Carte des clubs (Leaflet + fond OpenStreetMap ; adresses placées par le service de géocodage de l'IGN) ---------- */
let CARTE = null, COUCHE = null;
const GEO_URL = 'https://data.geopf.fr/geocodage/search';
const geoCle = l => [l.adresse, l.cp, l.ville].map(x => String(x || '').trim()).filter(Boolean).join(' ');
function geoCache(k, v) {
  try { const m = JSON.parse(localStorage.getItem('clb_geo') || '{}'); if (v === undefined) return m[k]; m[k] = v; localStorage.setItem('clb_geo', JSON.stringify(m)); } catch (e) { return undefined; }
}
// Renvoie {lat, lon, approx} ou null. approx = seule la commune a été trouvée (pas l'adresse précise).
async function geocoder(l) {
  if (l && typeof l.lat === 'number' && typeof l.lon === 'number') return { lat: l.lat, lon: l.lon, approx: !!l.approx };
  const q = geoCle(l || {}); if (!q) return null;
  const c = geoCache(q); if (c !== undefined) return c;
  try {
    const r = await fetch(GEO_URL + '?limit=1&q=' + encodeURIComponent(q) + (/^\d{5}$/.test(l.cp || '') ? '&postcode=' + l.cp : ''));
    if (!r.ok) return null;
    const ft = ((await r.json()).features || [])[0];
    let res = null;
    if (ft && ft.geometry && (ft.properties || {}).score >= 0.35) {
      const [lon, lat] = ft.geometry.coordinates;
      res = { lat: Math.round(lat * 1e6) / 1e6, lon: Math.round(lon * 1e6) / 1e6, approx: !['housenumber', 'street', 'locality'].includes(ft.properties.type) };
    }
    geoCache(q, res); return res;
  } catch (e) { return null; }
}
async function placerLieux(f) {     // ajoute lat / lon aux lieux d'une fiche (avant publication)
  for (const l of (f.lieux || [])) { delete l.lat; delete l.lon; delete l.approx; const g = await geocoder(l); if (g) Object.assign(l, g); }
  return f;
}
function initCarte() {
  if (CARTE || typeof L === 'undefined') return !!CARTE;
  // Molette désactivée (pour que la page défile normalement) ; sur téléphone, déplacement à deux doigts seulement via le zoom, pour ne pas bloquer le défilement
  CARTE = L.map('carte', { scrollWheelZoom: false, dragging: !L.Browser.mobile, zoomSnap: 0.5 }).setView([43.42, 6.2], 9);
  CARTE.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · adresses : IGN' }).addTo(CARTE);
  COUCHE = L.featureGroup().addTo(CARTE);
  CARTE.on('popupopen', e => { const b = e.popup.getElement().querySelector('[data-voir]'); if (b) b.onclick = () => voirClub(b.dataset.voir); });
  return true;
}
let JETON = 0;
async function majCarte(clubs) {
  const tour = ++JETON;
  const pts = [];
  for (const c of clubs) for (const l of ((c.fiche || {}).lieux || [])) { const g = await geocoder(l); if (g) pts.push({ c, l, g }); }
  if (tour !== JETON) return;                      // une recherche plus récente a été lancée entre-temps
  $('carte-bloc').hidden = !pts.length && !CARTE;
  if (!pts.length) { if (COUCHE) COUCHE.clearLayers(); $('carte-info').textContent = 'Aucun lieu à afficher pour cette recherche.'; return; }
  $('carte-bloc').hidden = false;
  if (!initCarte()) { $('carte-bloc').hidden = true; return; }
  COUCHE.clearLayers();
  for (const { c, l, g } of pts) {
    const adr = [l.adresse, [l.cp, l.ville].filter(Boolean).join(' ')].filter(Boolean).join(', ');

function lireLogo(file) {
  return new Promise((ok, ko) => {
    if (!/^image\//.test(file.type)) return ko(new Error("Ce fichier n'est pas une image."));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const max = 360, W = im.naturalWidth || max, H = im.naturalHeight || max, k = Math.min(1, max / Math.max(W, H));
      const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(W * k)); cv.height = Math.max(1, Math.round(H * k));
      const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, cv.width, cv.height);
      let d = cv.toDataURL('image/png');
      if (d.length > 300000) { cx.globalCompositeOperation = 'destination-over'; cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); d = cv.toDataURL('image/jpeg', .85); }
      URL.revokeObjectURL(url); ok(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); ko(new Error('Image illisible. Essayez un fichier PNG ou JPG.')); };
    im.src = url;
  });
}

    <div class="field"><label for="p-nom">Nom affiché</label><input id="p-nom" value="${esc(c.nom)}" maxlength="120"></div>
    <div class="field"><label>Lien personnel du club</label><input readonly value="${esc(lienClub(c))}" onfocus="this.select()"></div>
    <label class="chk"><input type="checkbox" id="p-actif" ${c.actif ? 'checked' : ''}> Club visible dans l'annuaire (décocher pour un club en sommeil)</label>
    <div class="row"><button class="btn primary" id="p-ok">Enregistrer</button><button class="btn ghost" id="p-ann">Retour</button></div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:12px">
      <button class="btn red sm" id="p-code">Changer le lien (l'ancien ne marchera plus)</button>
      ${c.fiche ? '<button class="btn red sm" id="p-dep">Retirer la fiche publiée</button>' : ''}
    </div></div>`;
  const maj = async (p, m) => { try { await rpc('clb_admin_club', { pwd: PWD, p: { code: c.code, ...p } }); ADM = await rpc('clb_admin_get', { pwd: PWD }); vueComite(m); } catch (e) { alert(e.message); } };
  $('p-ann').onclick = () => vueComite();
  $('p-ok').onclick = () => maj({ nom: $('p-nom').value.trim(), actif: $('p-actif').checked }, 'Club enregistré.');
  $('p-code').onclick = () => { if (confirm('Créer un nouveau lien pour ce club ? L\'ancien lien ne fonctionnera plus.')) maj({ nouveau_code: true }, 'Nouveau lien créé pour ' + c.nom + '.'); };
  if ($('p-dep')) $('p-dep').onclick = () => { if (confirm('Retirer la fiche publiée de ' + c.nom + ' ? Le club restera dans l\'annuaire, avec la mention « Fiche à venir ».')) maj({ depublier: true }, 'Fiche retirée.'); };
}
function vueValider(c) {
  const prop = c.proposition, f = prop || c.fiche || {};
  $('app').innerHTML = `<div><h1>${esc(c.nom)}</h1><p class="muted" style="margin-top:6px">${prop ? `Fiche envoyée par le club le ${esc(fmtD(c.propose_le))}${prop._auteur ? ' par ' + esc(prop._auteur) : ''}. Vous pouvez la corriger avant de la publier.` : c.fiche ? 'Fiche publiée : vos modifications seront en ligne tout de suite.' : 'Ce club n\'a pas encore répondu : vous pouvez remplir sa fiche vous-même.'}</p></div>
    ${prop && c.fiche ? '<div class="msg warn">Une fiche est déjà en ligne pour ce club. Publier remplace la fiche actuelle par celle-ci.</div>' : ''}
    <form id="fm" style="display:flex;flex-direction:column;gap:18px">${formHtml(f, true)}
      <div class="msg err" id="err" hidden></div>
      <div class="row"><button class="btn primary" type="submit" id="send">Publier la fiche</button>${prop ? '<button type="button" class="btn red" id="refus">Refuser cette proposition</button>' : ''}<button type="button" class="btn ghost" id="ann">Retour sans publier</button></div>
    </form>`;
  initForm(f, prop ? c.logo_propose : c.logo);
  window.scrollTo(0, 0);
  $('ann').onclick = () => vueComite();
  if ($('refus')) $('refus').onclick = async () => { if (!confirm('Écarter la fiche envoyée par le club ?' + (c.fiche ? ' La fiche en ligne ne changera pas.' : ''))) return; try { await rpc('clb_admin_refuser', { pwd: PWD, p_club: c.code }); ADM = await rpc('clb_admin_get', { pwd: PWD }); vueComite('Proposition écartée.'); } catch (e) { alert(e.message); } };
  $('fm').onsubmit = async ev => {
    ev.preventDefault(); $('err').hidden = true; $('send').disabled = true;
    try { await rpc('clb_admin_publier', { pwd: PWD, p_club: c.code, p_fiche: await placerLieux(lireForm()), p_logo: LOGO }); ADM = await rpc('clb_admin_get', { pwd: PWD }); vueComite('Fiche de ' + c.nom + ' publiée.'); window.scrollTo(0, 0); }
    catch (e) { $('err').textContent = 'Publication impossible : ' + e.message; $('err').hidden = false; $('send').disabled = false; }
  };
}

/* ---------- Aiguillage ---------- */
async function route() {
  const code = new URLSearchParams(location.search).get('club');
  if (code) return vueClub(code);
  if (location.hash === '#comite') {
    if (PWD) return vueComite();
    let mem = ''; try { mem = sessionStorage.getItem('clb_admin') || ''; } catch (e) {}
    return mem ? entrer(mem) : vueLogin();
  }
  vuePublique();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
