<style>

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }

  .tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  .t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); background: #F8FAFD; white-space: nowrap; }

  .t tfoot td { font-weight: 800; background: #F8FAFD; border-top: 1px solid var(--line); color: var(--navy); }

  .b-ok { background: var(--ok-bg); color: var(--ok); } .b-warn { background: var(--warn-bg); color: var(--warn); } .b-bad { background: var(--bad-bg); color: var(--bad); }
  .b-auto { background: #E3F4F1; color: #0E7C6B; }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }

  .bord { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; }
  .bord:hover { border-color: var(--blue); }
  .bord .n { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 24px; color: var(--navy); text-transform: uppercase; line-height: 1; }
  .bord .tot { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 26px; color: var(--navy); }
  .bord.new { border-style: dashed; align-items: center; justify-content: center; color: var(--blue); font-weight: 700; cursor: pointer; min-height: 130px; background: transparent; font-family: inherit; font-size: 15px; }

  /* Choix des articles */
  .picker { position: relative; }
  .picker-list { border: 1px solid var(--line); border-radius: 12px; background: #fff; max-height: 340px; overflow-y: auto; margin-top: 8px; }
  .picker-cat { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; padding: 8px 12px 4px; background: #F8FAFD; position: sticky; top: 0; }
  .pick { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; width: 100%; padding: 8px 12px; border: 0; border-top: 1px solid var(--line2); background: #fff; text-align: left; cursor: pointer; font-family: inherit; font-size: 13.5px; color: var(--text); align-items: center; }
  .pick:hover, .pick:focus { background: #EEF3FC; outline: none; }
  .pick .p { font-weight: 700; color: var(--navy); white-space: nowrap; }
  .fac-total { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-top: 14px; font-size: 15px; }
  .fac-total .big { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 30px; color: var(--navy); }
  .clubnav { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 18px; border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 700; color: var(--text); text-decoration: none; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip.has::after { content: ''; width: 7px; height: 7px; border-radius: 4px; background: var(--accent); }
  .save { font-size: 13px; font-weight: 600; } .save.ok { color: var(--ok); } .save.err { color: var(--bad); } .save.wait { color: var(--muted); }
  details.help summary { cursor: pointer; font-weight: 700; color: var(--blue); font-size: 14px; }
  details.help div { margin-top: 8px; font-size: 14px; color: var(--muted); }

  .overlay { position: fixed; inset: 0; background: rgba(11,33,73,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal.wide { max-width: 760px; }
  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--navy); }
  .login .modal { max-width: 380px; }
  .login img { height: 64px; align-self: center; }

  @media (max-width: 760px) {
    .wrap { padding: 0 14px; }
    .g2, .g3, .g4, .g6 { grid-template-columns: 1fr; }
    header { position: static; }
    .head nav { margin-left: 0; }

  @media print { header, .noprint { display: none !important; } body { background: #fff; } .card { border: 0; padding: 0; } }
</style>

<body>
<div id="app"></div>
<script>
// ======================== CONFIG ========================
const SUPABASE_URL = 'https://nssdhgpvkdbgdewsnlgl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GeMMc45mQbDOq-ZkU5vXZw_lYJe9KXf';
const MODES = ['Virement', 'Chèque', 'Espèces', 'Autre'];
const OPEN_COMP = { MFM: 'M15 4x4 féminin', M4M: 'M15 4x4 masculin', CFM: 'M18 4x4 féminin', C4M: 'M18 4x4 masculin', O11: 'OPEN 2 contre 2', O13: 'OPEN 4 contre 4' };

// ======================== OUTILS ========================
const $ = id => document.getElementById(id);
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function rpc(fn, args) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {}),
  });
  const txt = await res.text();
  if (!res.ok) { let m = txt; try { m = JSON.parse(txt).message || txt; } catch(e) {} throw new Error(m); }
  return txt ? JSON.parse(txt) : null;
}
const r2 = n => Math.round((+n || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const fmtN = n => r2(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const euros = n => fmtN(n) + ' €';
const qte = n => r2(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
function parseD(s) { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function fmtD(s) { const d = parseD(s); return d ? String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear() : ''; }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function saisonDe(s) { const d = parseD(s) || new Date(); const y = d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; return y + '-' + (y + 1); }
const coll = new Intl.Collator('fr', { sensitivity: 'base', numeric: true });
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function slug(t) { return String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '-').replace(/^-|-$/g, ''); }
function toast(txt, cls = 'ok') { const s = $('savemark'); if (s) { s.className = 'save ' + cls; s.textContent = txt; clearTimeout(toast.t); if (cls === 'ok') toast.t = setTimeout(() => { s.textContent = ''; }, 2500); } }
function fail(e) { console.error(e); toast('⚠ ' + e.message, 'err'); alert(e.message); }

// ======================== ÉTAT ========================
let PWD = '', SAISON = saisonDe(today()), D = null, SRC = null;
const club = code => (D.clubs.find(c => c.code === code) || { code, nom: code });
const bord = id => D.bordereaux.find(b => String(b.id) === String(id));
const art = id => D.articles.find(a => String(a.id) === String(id));
const artCle = k => D.articles.find(a => a.cle === k);
const montant = l => r2(num(l.quantite) * num(l.prix));
const lignesDe = (bid, code) => D.lignes.filter(l => String(l.bordereau_id) === String(bid) && (!code || l.club === code));
const totalDe = (bid, code) => r2(lignesDe(bid, code).reduce((s, l) => s + montant(l), 0));
const bordNom = b => 'Bordereau n° ' + b.numero;
const facNum = (b, code) => `${b.saison.slice(2, 4)}${b.saison.slice(7, 9)}-${String(b.numero).padStart(2, '0')}-${code}`;
const reglage = (k, d) => (D.reglages && D.reglages[k] != null) ? D.reglages[k] : d;
const bordsTries = () => [...D.bordereaux].sort((a, b) => a.numero - b.numero);

// Paiements d'un club : d'abord imputés au bordereau indiqué, puis le reste sur les bordereaux les plus anciens
function etatClub(code) {
  const bs = bordsTries(), du = {}, regle = {};
  bs.forEach(b => { du[b.id] = totalDe(b.id, code); regle[b.id] = 0; });
  const pays = D.paiements.filter(p => p.club === code);
  let libre = 0;
  pays.forEach(p => { if (p.bordereau_id && regle[p.bordereau_id] != null) regle[p.bordereau_id] += num(p.montant); else libre += num(p.montant); });
  bs.forEach(b => { const reste = du[b.id] - regle[b.id]; if (reste > 0 && libre > 0) { const x = Math.min(reste, libre); regle[b.id] += x; libre -= x; } });
  const totDu = r2(Object.values(du).reduce((s, x) => s + x, 0)), totRegle = r2(pays.reduce((s, p) => s + num(p.montant), 0));
  return { du, regle, totDu, totRegle, reste: r2(totDu - totRegle) };
}
function etatCell(b, e) {
  const du = e.du[b.id] || 0, rg = r2(e.regle[b.id] || 0);
  if (!du) return 'zero';
  if (rg >= du - 0.005) return 'paid';
  if (rg > 0) return 'part';
  return b.statut === 'envoye' ? 'due' : 'draft';
}
const clubsVisibles = () => D.clubs.filter(c => c.actif || D.lignes.some(l => l.club === c.code) || D.paiements.some(p => p.club === c.code))
  .sort((a, b) => coll.compare(a.code, b.code));

async function load() {
  D = await rpc('fac_admin_get', { pwd: PWD, p_saison: SAISON });
  D.lignes.forEach(l => { l.quantite = num(l.quantite); l.prix = num(l.prix); });
}

// ======================== CONNEXION ========================
function renderLogin(err) {
  $('app').innerHTML = `<div class="login"><form class="modal" id="lg">
    <img src="logo-comite-var.jpg" alt="">
    <h2 class="cond c" style="font-size:24px">Facturation des clubs</h2>
    <p class="small muted c" style="margin-top:-8px">Espace réservé au Comité du Var de Volley-Ball</p>
    <div class="field"><label for="pwd">Mot de passe</label><input id="pwd" type="password" autocomplete="current-password" required></div>
    <div id="lg-err" class="msg err" ${err ? '' : 'hidden'}>${esc(err || '')}</div>
    <button class="btn primary" type="submit">Entrer</button></form></div>`;
  $('pwd').focus();
  $('lg').onsubmit = async ev => {
    ev.preventDefault();
    PWD = $('pwd').value;
    try { await load(); try { sessionStorage.setItem('fac_admin', PWD); } catch(e) {} route(); }
    catch(e) { PWD = ''; renderLogin(/refus/i.test(e.message) ? 'Mot de passe incorrect.' : e.message); }
  };
}
function logout() { PWD = ''; D = null; try { sessionStorage.removeItem('fac_admin'); } catch(e) {} location.hash = ''; renderLogin(); }

// ======================== MISE EN PAGE ========================
function shell(tab, body) {
  const saisons = [...new Set([...(D.saisons || []), saisonDe(today()), SAISON])].sort().reverse();
  const nav = [['recap', 'Récapitulatif'], ['bordereaux', 'Bordereaux'], ['paiements', 'Paiements'], ['articles', 'Articles'], ['clubs', 'Clubs'], ['reglages', 'Réglages']];
  $('app').innerHTML = `
  <header><div class="wrap head">
    <img src="logo-comite-var.jpg" alt="Comité du Var de Volley-Ball">
    <div class="t">Facturation clubs</div>
    <select id="saison" aria-label="Saison">${saisons.map(s => `<option ${s === SAISON ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <nav>${nav.map(([k, t]) => `<a class="navbtn ${tab === k ? 'on' : ''}" href="#${k}">${t}</a>`).join('')}
      <button class="linkbtn" onclick="logout()">Déconnexion</button></nav>
  </div></header>
  <main class="wrap stack">${body}<div id="savemark" class="save" style="position:fixed;bottom:14px;right:18px;background:#fff;padding:4px 10px;border-radius:8px"></div></main>`;
  $('saison').onchange = async e => { SAISON = e.target.value; SRC = null; try { await load(); location.hash = 'recap'; route(); } catch(err) { fail(err); } };
}

// ======================== RÉCAPITULATIF ========================
function renderRecap() {
  const bs = bordsTries(), clubs = clubsVisibles();
  const etats = Object.fromEntries(clubs.map(c => [c.code, etatClub(c.code)]));
  const totDu = r2(clubs.reduce((s, c) => s + etats[c.code].totDu, 0)), totRg = r2(clubs.reduce((s, c) => s + etats[c.code].totRegle, 0));
  const aJour = clubs.filter(c => etats[c.code].totDu > 0 && etats[c.code].reste <= 0.005).length, factures = clubs.filter(c => etats[c.code].totDu > 0).length;
  const rows = clubs.map(c => {
    const e = etats[c.code];
    return `<tr><td class="club"><b>${esc(c.code)}</b><small>${esc(c.nom)}</small></td>
      ${bs.map(b => { const cl = etatCell(b, e); return `<td class="c"><a class="cell ${cl}" href="#b/${b.id}/${encodeURIComponent(c.code)}" title="${esc(bordNom(b))} – réglé ${euros(e.regle[b.id] || 0)}">${e.du[b.id] ? fmtN(e.du[b.id]) : '—'}</a></td>`; }).join('')}
      <td class="num"><b>${fmtN(e.totDu)}</b></td><td class="num">${fmtN(e.totRegle)}</td>
      <td class="num" style="color:${e.reste > 0.005 ? 'var(--bad)' : e.reste < -0.005 ? 'var(--blue)' : 'var(--ok)'};font-weight:800">${e.reste < -0.005 ? 'avoir ' + fmtN(-e.reste) : fmtN(e.reste)}</td>
      <td class="c">${e.reste > 0.005 ? `<button class="btn sm ghost" onclick="openPaiement({club:'${esc(c.code)}'})">+ Paiement</button>` : ''}</td></tr>`;
  }).join('');

  <div class="clubnav noprint">${clubs.map(k => `<a class="chip ${k.code === code ? 'on' : ''} ${totalDe(b.id, k.code) ? 'has' : ''}" href="#b/${b.id}/${encodeURIComponent(k.code)}">${esc(k.code)}</a>`).join('')}</div>

function pickList(b, code) {
  const q = norm(PICK_Q).split(' ').filter(Boolean);
  const as = D.articles.filter(a => a.actif && q.every(w => norm(`${a.code_compta} ${a.designation} ${a.categorie}`).includes(w)));
  const cats = [...new Set(as.map(a => a.categorie || 'Autres'))];
  $('pk-list').innerHTML = as.length ? cats.map(cat => `<div class="picker-cat">${esc(cat)}</div>` + as.filter(a => (a.categorie || 'Autres') === cat).map(a =>
    `<button class="pick" onclick="ajoutArticle(${b.id},'${esc(code)}',${a.id})"><span class="code muted">${esc(a.code_compta || '—')}</span><span>${esc(a.designation)}</span><span class="p">${euros(a.prix)}${a.unite ? ' / ' + esc(a.unite) : ''}</span></button>`).join('')).join('')
    : `<div class="muted small" style="padding:12px">Aucun article ne correspond. Ajoutez-le dans l'onglet <a href="#articles">Articles</a>, ou utilisez « Ligne libre ».</div>`;
}
async function enregistrerLignes(lignes, suppr) {
  return rpc('fac_admin_lignes', { pwd: PWD, p_lignes: lignes, p_suppr: suppr || [] });
}
async function ajoutArticle(bid, code, aid) {
  const a = art(aid), b = bord(bid);
  const l = { bordereau_id: bid, club: code, article_id: a.id, date_ligne: b.date, code_compta: a.code_compta, designation: a.designation, quantite: 1, prix: num(a.prix), ordre: lignesDe(bid, code).length };
  try {
    const [id] = await enregistrerLignes([l]); D.lignes.push({ ...l, id });
    renderFacture(b, code); toast('✓ Ligne ajoutée');
    const inp = document.querySelector(`#fac-t tr[data-id="${id}"] input[data-k="quantite"]`); if (inp) { inp.focus(); inp.select(); }
  } catch(e) { fail(e); }
}
async function ajoutLibre() {
  const [, , bid, code] = location.hash.match(/^#(b)\/(\d+)\/(.+)$/) || [];
  const b = bord(bid), c = decodeURIComponent(code);
  const l = { bordereau_id: b.id, club: c, date_ligne: b.date, designation: 'NOUVELLE LIGNE', quantite: 1, prix: 0, ordre: lignesDe(b.id, c).length };
  try {
    const [id] = await enregistrerLignes([l]); D.lignes.push({ ...l, id }); renderFacture(b, c);
    const inp = document.querySelector(`#fac-t tr[data-id="${id}"] [data-k="designation"]`); if (inp) { inp.focus(); inp.select(); }
  } catch(e) { fail(e); }
}
async function majLigne(id, k, v) {
  const l = D.lignes.find(x => x.id === id); if (!l) return;
  const avant = l[k];
  l[k] = (k === 'quantite' || k === 'prix') ? num(v) : v;
  toast('Enregistrement…', 'wait');
  try {
    await enregistrerLignes([l]);
    const tr = document.querySelector(`#fac-t tr[data-id="${id}"]`);
    if (tr) { tr.querySelector('[data-tot]').innerHTML = `<b>${fmtN(montant(l))}</b>`; if (k === 'prix') tr.querySelector('[data-k=prix]').value = fmtN(l.prix); }
    const b = bord(l.bordereau_id);
    $('fac-tot').textContent = euros(totalDe(b.id, l.club));
    const e = etatClub(l.club); $('fac-reg').textContent = e.regle[b.id] ? `Réglé : ${euros(e.regle[b.id])} · reste ${euros(totalDe(b.id, l.club) - e.regle[b.id])}` : '';
    toast('✓ Enregistré');
  } catch(e) { l[k] = avant; fail(e); }
}
async function supprLigne(id) {
  const l = D.lignes.find(x => x.id === id);
  try { await enregistrerLignes([], [id]); D.lignes = D.lignes.filter(x => x.id !== id); renderFacture(bord(l.bordereau_id), l.club); toast('✓ Ligne supprimée'); } catch(e) { fail(e); }
}

      <tfoot><tr><td>Total</td><td id="g-tq" class="num"></td><td id="g-tm" class="num"></td><td></td></tr></tfoot></table></div>

  $('g-prix').oninput = calc;
  document.querySelectorAll('.g-q').forEach(i => { i.oninput = calc; i.onkeydown = ev => { if (ev.key === 'Enter') { const all = [...document.querySelectorAll('.g-q')]; const n = all[all.indexOf(i) + 1]; if (n) n.focus(); } }; });

      designation: $('g-des').value.trim(), precisions: $('g-pre').value.trim(), quantite: num(i.value), prix: num($('g-prix').value), ordre: lignesDe(b.id, i.dataset.c).length }));

  };
}

// ======================== AJOUTS AUTOMATIQUES ========================
// Retrouve le club du Comité à partir du texte saisi ailleurs (sigle, nom, ville…)
function matchClub(txt) {
  const t = norm(txt); if (!t) return null;
  let c = D.clubs.find(k => norm(k.code) === t || norm(k.numero) === t || norm(k.nom) === t);
  if (c) return c.code;
  c = D.clubs.find(k => String(k.alias || '').split(',').map(norm).filter(Boolean).some(a => a === t));
  if (c) return c.code;
  const cands = D.clubs.filter(k => [k.nom, ...String(k.alias || '').split(',')].map(norm).filter(x => x.length >= 4).some(a => t.includes(a) || a.includes(t)));
  return cands.length === 1 ? cands[0].code : null;
}
const factureSource = (src, code) => D.lignes.filter(l => l.source === src && (!code || l.club === code));
let FORCE_FIN = false;   // facturer aussi ce qui n'est dû qu'en fin de saison, avant le dernier tournoi
const TIERS = ['1 TOURNOI', '2 TOURNOIS', '3 TOURNOIS ET PLUS'];
// Équipes d'un club dans une compétition : l'équipe n joue chaque tournoi où le club a inscrit au moins n équipes
function equipesOpen(parTournoi) {
  const nums = Object.keys(parTournoi).map(Number).sort((a, b) => a - b), max = Math.max(0, ...Object.values(parTournoi));
  const eq = [];
  for (let j = 1; j <= max; j++) eq.push({ n: j, tournois: nums.filter(t => parTournoi[t] >= j) });
  return eq;
}
// Équipes déjà facturées : la source d'une ligne OPEN est « open:O11#1,3 » (numéros d'équipes)
function equipesFacturees(comp, code) {
  const s = new Set();
  D.lignes.filter(l => l.club === code && String(l.source || '').startsWith('open:' + comp + '#')).forEach(l => l.source.split('#')[1].split(',').forEach(n => s.add(+n)));
  return s;
}
const sansTarif = d => String(d || '').replace(/\s*\([^)]*€[^)]*\)\s*$/, '');

function propositions() {
  const P = [], inconnus = new Map(), attente = [], tarifs = reglage('open_tarifs', [10, 35, 60]).map(num), auj = SRC.aujourdhui || today();
  const noter = (txt, ou) => { if (!inconnus.has(txt)) inconnus.set(txt, new Set()); inconnus.get(txt).add(ou); };
  // --- Compétitions OPEN et M15/M18 4x4 : 3 tournois et plus dès qu'ils sont atteints, 1 ou 2 tournois après le dernier tournoi
  const finComp = {};
  (SRC.open_tournois || []).forEach(t => { finComp[t.competition] = finComp[t.competition] && finComp[t.competition] > t.date ? finComp[t.competition] : t.date; });
  const parComp = {};
  (SRC.open || []).forEach(r => {
    if (r.date > auj) return;   // seuls les tournois déjà joués comptent
    const code = matchClub(r.club); if (!code) { noter(r.club, OPEN_COMP[r.competition] || r.competition); return; }
    const k = r.competition + '|' + code; (parComp[k] = parComp[k] || { comp: r.competition, club: code, t: {} });
    parComp[k].t[r.numero] = (parComp[k].t[r.numero] || 0) + num(r.nb);
  });
  Object.values(parComp).sort((x, y) => coll.compare(x.comp, y.comp) || coll.compare(x.club, y.club)).forEach(x => {
    const fini = finComp[x.comp] && finComp[x.comp] < auj, deja = equipesFacturees(x.comp, x.club);
    const a = artCle('open_' + x.comp) || {}, des = a.designation || ('ENGAGEMENT ' + (OPEN_COMP[x.comp] || x.comp).toUpperCase());
    const groupes = [[], [], []];
    equipesOpen(x.t).filter(e => !deja.has(e.n) && e.tournois.length).forEach(e => {
      const nb = e.tournois.length;
      if (nb >= 3) groupes[2].push(e);
      else if (fini || FORCE_FIN) groupes[nb - 1].push(e);
      else attente.push({ quoi: OPEN_COMP[x.comp] || x.comp, club: x.club, txt: `équipe ${e.n} : ${nb} tournoi${nb > 1 ? 's' : ''} pour l'instant` , fin: finComp[x.comp] });
    });
    groupes.forEach((g, i) => { if (!g.length) return;
      P.push({ groupe: 'open', club: x.club, source: `open:${x.comp}#${g.map(e => e.n).join(',')}`, article_id: a.id || null, code_compta: a.code_compta || '756010',
        designation: `${des} – ${TIERS[i]} (${tarifs[i]} € / ÉQUIPE)`, precisions: g.map(e => `Équipe ${e.n} : tournoi${e.tournois.length > 1 ? 's' : ''} ${e.tournois.join(', ')}`).join(' · '),
        quantite: g.length, prix: tarifs[i], info: i < 2 ? 'après le dernier tournoi' : '' }); });
  });
  // --- Pitchoun' Volley : tous les enfants ayant joué au moins un plateau, après le dernier plateau
  const ap = artCle('pitchoun') || { designation: "ENGAGEMENT PITCHOUN' VOLLEY (7 € / ENFANT / SAISON)", prix: 7, code_compta: '756020' };
  const pitFini = SRC.pitchoun_fin && SRC.pitchoun_fin < auj, pit = {};
  (SRC.pitchoun || []).forEach(r => { const code = matchClub(r.club); if (!code) { noter(r.club, "Pitchoun' Volley"); return; } pit[code] = (pit[code] || 0) + num(r.nb); });
  Object.entries(pit).sort().forEach(([code, n]) => {
    const deja = factureSource('pitchoun', code).reduce((s, l) => s + num(l.quantite), 0);
    if (n - deja <= 0) return;
    if (!pitFini && !FORCE_FIN) { attente.push({ quoi: "Pitchoun' Volley", club: code, txt: `${n} enfant${n > 1 ? 's' : ''} pour l'instant`, fin: SRC.pitchoun_fin }); return; }
    P.push({ groupe: 'pitchoun', club: code, source: 'pitchoun', article_id: ap.id || null, code_compta: ap.code_compta, designation: ap.designation, quantite: n - deja, prix: num(ap.prix),
      info: `${n} enfant${n > 1 ? 's' : ''} ayant joué au moins un plateau${deja ? ` · ${qte(deja)} déjà facturé(s)` : ''}` });
  });
  // --- Participation des clubs aux stages du Centre Départemental (stages terminés, enfants convoqués non absents)
  const ac = artCle('cde_club') || { designation: 'PARTICIPATION DES CLUBS AUX STAGES DU CENTRE DÉPARTEMENTAL (12 € / JOUR)', prix: 12, code_compta: '706003' };
  (SRC.cde || []).forEach(st => {
    const parClub = {};
    (st.enfants || []).forEach(e => { const code = matchClub(e.club); if (!code) { noter(e.club || '(club non renseigné)', 'Centre Départemental'); return; } (parClub[code] = parClub[code] || []).push(e); });
    Object.entries(parClub).sort().forEach(([code, es]) => {
      const src = 'cde:' + st.stage_id; if (factureSource(src, code).length) return;
      const j = num(st.jours) || 1;
      P.push({ groupe: 'cde', club: code, source: src, article_id: ac.id || null, code_compta: ac.code_compta, date_ligne: st.debut,
        designation: `${sansTarif(ac.designation)} – ${String(st.stage).toUpperCase()} (${j} JOUR${j > 1 ? 'S' : ''} × ${fmtN(ac.prix).replace(',00', '')} €)`,
        precisions: es.map(e => `${e.prenom} ${String(e.nom).toUpperCase()}${e.reponse === 'attente' ? ' (présence non confirmée)' : ''}`).join(', '),
        quantite: es.length, prix: r2(num(ac.prix) * j), info: `${fmtD(st.debut)} – ${fmtD(st.fin)}` });
    });
  });
  // --- Stages réglés par le club à la place de la famille
  (SRC.stages || []).forEach(r => {
    const src = 'stage:' + r.id; if (factureSource(src).length) return;
    const code = matchClub(r.club); if (!code) { noter(r.club || '(club non renseigné)', 'Stages'); return; }
    const as = artCle(r.type === 'beach' ? 'stage_beach' : 'stage_cde') || {};
    P.push({ groupe: 'stages', club: code, source: src, article_id: as.id || null, code_compta: as.code_compta || (r.type === 'beach' ? '706002' : '706001'), date_ligne: r.date,
      designation: `${as.designation || 'PARTICIPATION STAGE'} – ${String(r.stage).toUpperCase()}`, precisions: `${r.prenom} ${String(r.nom).toUpperCase()}`, quantite: 1, prix: num(r.montant), info: fmtD(r.date) });
  });
  return { P, inconnus, attente };
}

    ${groupes.map(([g, tt, h]) => { const ps = P.map((p, i) => ({ ...p, i })).filter(p => p.groupe === g); return `<div class="stack" style="gap:8px"><h3>${tt} <span class="muted" style="font-size:15px">· ${ps.length ? euros(ps.reduce((s, p) => s + p.quantite * p.prix, 0)) : 'rien à ajouter'}</span></h3><p class="small muted">${h}</p>

  });
}

async function nouveauClub() {

}

// ======================== PDF ========================
let LOGO = null;
async function logo() {
  if (LOGO !== null) return LOGO;
  try { const bl = await (await fetch('logo-comite-var.jpg')).blob(); LOGO = await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(bl); }); } catch(e) { LOGO = ''; }
  return LOGO;
}
const pdfTxt = s => String(s == null ? '' : s).replace(/[  ]/g, ' ').replace(/[’]/g, "'");
const pdfN = n => pdfTxt(fmtN(n));
function pageFacture(doc, b, code, img) {
  const c = club(code), ls = lignesDe(b.id, code), W = 210, M = 16, navy = [11, 33, 73];
  doc.setTextColor(20, 32, 58);
  let lw = 0;
  if (img) { try { const ip = doc.getImageProperties(img), h = 22; lw = Math.min(40, h * ip.width / ip.height); doc.addImage(img, 'JPEG', M, 12, lw, lw * ip.height / ip.width); } catch(e) { lw = 0; } }
  const X = M + (lw ? lw + 5 : 0);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
  const em = pdfTxt(reglage('emetteur', 'Comité du Var de Volley-Ball')).split('\n');
  doc.text(em[0] || '', X, 17); doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  em.slice(1).forEach((t, i) => doc.text(t, X, 21.5 + i * 4.2));
  doc.setFont('helvetica', 'bold'); doc.setFontSize(24); doc.setTextColor(...navy); doc.text('FACTURE', W - M, 20, { align: 'right' });
  doc.setFontSize(10); doc.setTextColor(20, 32, 58); doc.text('N° ' + facNum(b, code), W - M, 27, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  doc.text(pdfTxt(`Bordereau n° ${b.numero} du ${fmtD(b.date)}`), W - M, 32, { align: 'right' });
  doc.text('Saison ' + b.saison.replace('-', '/'), W - M, 36.5, { align: 'right' });
  // destinataire
  const y0 = 46; doc.setDrawColor(201, 210, 226); doc.setFillColor(244, 246, 250); doc.roundedRect(W - M - 92, y0, 92, 26, 2, 2, 'FD');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
  const nomL = doc.splitTextToSize(pdfTxt(c.nom), 84); doc.text(nomL, W - M - 88, y0 + 6.5);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  let yy = y0 + 6.5 + nomL.length * 4.6;
  if (c.numero) { doc.text('N° d\'affiliation ' + c.numero, W - M - 88, yy); yy += 4.2; }
  if (c.adresse) doc.text(doc.splitTextToSize(pdfTxt(c.adresse), 84).slice(0, 2), W - M - 88, yy);
  if (b.titre) { doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text(pdfTxt(b.titre), M, y0 + 8); }
  // tableau
  const cols = [{ t: 'Date', x: M, w: 19 }, { t: 'Compte', x: M + 19, w: 16 }, { t: 'Désignation', x: M + 35, w: 89 }, { t: 'Qté', x: M + 124, w: 14, r: 1 }, { t: 'P.U. €', x: M + 138, w: 20, r: 1 }, { t: 'Total €', x: M + 158, w: 20, r: 1 }];
  let y = 82;
  const head = () => {
    doc.setFillColor(...navy); doc.rect(M, y - 5, W - 2 * M, 7.5, 'F'); doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
    cols.forEach(k => doc.text(pdfTxt(k.t), k.r ? k.x + k.w - 1.5 : k.x + 1.5, y, k.r ? { align: 'right' } : {}));
    doc.setTextColor(20, 32, 58); doc.setFont('helvetica', 'normal'); y += 7;
  };
  head();
  ls.forEach((l, i) => {
    doc.setFontSize(8.5);
    const des = doc.splitTextToSize(pdfTxt(l.designation), cols[2].w - 3);
    doc.setFontSize(7.5); const pre = l.precisions ? doc.splitTextToSize(pdfTxt(l.precisions), cols[2].w - 3) : []; doc.setFontSize(8.5);
    const h = Math.max(1, des.length) * 3.8 + pre.length * 3.3 + 2.4;
    if (y + h > 262) { doc.addPage(); y = 20; head(); }
    if (i % 2) { doc.setFillColor(248, 250, 253); doc.rect(M, y - 4, W - 2 * M, h, 'F'); }
    doc.text(fmtD(l.date_ligne), cols[0].x + 1.5, y); doc.text(pdfTxt(l.code_compta || ''), cols[1].x + 1.5, y); doc.text(des, cols[2].x + 1.5, y);
    if (pre.length) { doc.setFontSize(7.5); doc.setFont('helvetica', 'italic'); doc.setTextColor(86, 98, 122); doc.text(pre, cols[2].x + 1.5, y + des.length * 3.8 - 0.4); doc.setTextColor(20, 32, 58); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); }
    doc.text(pdfTxt(qte(l.quantite)), cols[3].x + cols[3].w - 1.5, y, { align: 'right' }); doc.text(pdfN(l.prix), cols[4].x + cols[4].w - 1.5, y, { align: 'right' });
    doc.setFont('helvetica', 'bold'); doc.text(pdfN(montant(l)), cols[5].x + cols[5].w - 1.5, y, { align: 'right' }); doc.setFont('helvetica', 'normal');
    y += h;
  });
  doc.setDrawColor(...navy); doc.setLineWidth(0.4); doc.line(M, y - 2.5, W - M, y - 2.5);
  if (y > 240) { doc.addPage(); y = 24; }
  const tot = totalDe(b.id, code), e = etatClub(code), rg = r2(e.regle[b.id] || 0);
  y += 5; doc.setFillColor(...navy); doc.rect(W - M - 70, y - 5.5, 70, 10, 'F'); doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
  doc.text('TOTAL', W - M - 66, y + 1); doc.text(pdfTxt(euros(tot)), W - M - 3, y + 1, { align: 'right' }); doc.setTextColor(20, 32, 58);
  if (rg > 0) { y += 10; doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.text(pdfTxt('Déjà réglé : ' + euros(rg)), W - M - 3, y, { align: 'right' }); y += 5; doc.setFont('helvetica', 'bold'); doc.text(pdfTxt('Reste à payer : ' + euros(Math.max(0, tot - rg))), W - M - 3, y, { align: 'right' }); }
  // pied : coordonnées bancaires puis mentions
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
  const me = doc.splitTextToSize(pdfTxt(reglage('mentions', '')), W - 2 * M), yMe = 285 - me.length * 3.8;
  const bq = pdfTxt(reglage('banque', '')).split('\n').map(x => x.trim()).filter(Boolean);
  if (bq.length) {
    const hB = 9 + bq.length * 4.4, yB = yMe - 4 - hB;
    if (y + 6 > yB) { doc.addPage(); }
    doc.setDrawColor(201, 210, 226); doc.setFillColor(244, 246, 250); doc.roundedRect(M, yB, 120, hB, 2, 2, 'FD');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...navy); doc.text('Règlement par virement', M + 4, yB + 5.5);
    doc.setFont('courier', 'normal'); doc.setFontSize(8.8); doc.setTextColor(20, 32, 58);
    bq.forEach((t, i) => { if (/^(IBAN|BIC)/i.test(t)) doc.setFont('courier', 'bold'); else doc.setFont('helvetica', 'normal'); doc.text(t, M + 4, yB + 10.5 + i * 4.4); });
  }
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(86, 98, 122);
  doc.text(me, M, yMe);
}
async function pdfClubs(bid, codes) {
  if (!window.jspdf) { alert('Le module PDF n\'a pas pu se charger. Vérifiez votre connexion et réessayez.'); return; }
  const b = bord(bid), img = await logo(), { jsPDF } = window.jspdf, doc = new jsPDF({ unit: 'mm', format: 'a4' });
  codes.forEach((code, i) => { if (i) doc.addPage(); pageFacture(doc, b, code, img); });
  doc.save(codes.length === 1 ? `Facture-${facNum(b, codes[0])}.pdf` : `Bordereau-${b.numero}-${b.saison}.pdf`);
}
async function mailClub(bid, code) {
  const b = bord(bid), c = club(code), tot = totalDe(bid, code);
  await pdfClubs(bid, [code]);
  const body = `Bonjour,\n\nVeuillez trouver ci-joint la facture n° ${facNum(b, code)} (bordereau n° ${b.numero} du ${fmtD(b.date)}) d'un montant de ${euros(tot)}.\n\n${reglage('mentions', '')}${reglage('banque', '') ? '\n\nCoordonnées bancaires :\n' + reglage('banque', '') : ''}\n\nSportivement,\nLe Comité du Var de Volley-Ball`;
  window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(c.email || '') + '&su=' + encodeURIComponent(`Facture Comité du Var – bordereau n° ${b.numero} – ${c.nom}`) + '&body=' + encodeURIComponent(body), '_blank');
  if (!c.email) toast('Pas de mail enregistré pour ce club (onglet Clubs)', 'err');
}

// ======================== EXPORT EXCEL ========================
function loadScript(src) { return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('Module Excel indisponible')); document.head.appendChild(s); }); }
async function exportExcel() {
  try { if (!window.XLSX) await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'); } catch(e) { return fail(e); }
  const bs = bordsTries(), clubs = clubsVisibles();
  const recap = [['Club', 'Nom', ...bs.map(b => `Bordereau N°${b.numero}`), 'Total dû', 'Réglé', 'Reste']];
  clubs.forEach(c => { const e = etatClub(c.code); recap.push([c.code, c.nom, ...bs.map(b => e.du[b.id] || 0), e.totDu, e.totRegle, e.reste]); });
  recap.push(['TOTAL', '', ...bs.map(b => totalDe(b.id)), ...['totDu', 'totRegle', 'reste'].map(k => r2(clubs.reduce((s, c) => s + etatClub(c.code)[k], 0)))]);
  const det = [['Bordereau', 'Date bordereau', 'Facture', 'Club', 'Date', 'Compte', 'Désignation', 'Précisions', 'Quantité', 'Prix unitaire', 'Montant']];
  bs.forEach(b => D.lignes.filter(l => l.bordereau_id === b.id).sort((x, y) => coll.compare(x.club, y.club) || x.ordre - y.ordre).forEach(l =>
    det.push([b.numero, fmtD(b.date), facNum(b, l.club), l.club, fmtD(l.date_ligne), l.code_compta || '', l.designation, l.precisions || '', l.quantite, l.prix, montant(l)])));
  const pay = [['Date', 'Club', 'Montant', 'Mode', 'Référence', 'Imputé sur', 'Remarque']];
  D.paiements.forEach(p => pay.push([fmtD(p.date), p.club, num(p.montant), p.mode || '', p.reference || '', p.bordereau_id ? 'N°' + (bord(p.bordereau_id) || {}).numero : 'auto', p.remarque || '']));
  const parCompte = {}; D.lignes.forEach(l => { const k = l.code_compta || '(sans compte)'; parCompte[k] = r2((parCompte[k] || 0) + montant(l)); });
  const cpt = [['Compte', 'Montant'], ...Object.entries(parCompte).sort()];
  const wb = XLSX.utils.book_new();
  const ws = (rows, w) => { const s = XLSX.utils.aoa_to_sheet(rows, { cellDates: true, dateNF: 'dd/mm/yyyy' }); s['!cols'] = w.map(x => ({ wch: x })); return s; };
  XLSX.utils.book_append_sheet(wb, ws(recap, [9, 34, ...bs.map(() => 14), 12, 12, 12]), 'Récapitulatif');
  XLSX.utils.book_append_sheet(wb, ws(det, [10, 12, 18, 8, 11, 9, 60, 40, 9, 11, 11]), 'Détail des factures');
  XLSX.utils.book_append_sheet(wb, ws(pay, [11, 8, 11, 10, 16, 11, 30]), 'Paiements');
  XLSX.utils.book_append_sheet(wb, ws(cpt, [16, 12]), 'Par compte');
  XLSX.writeFile(wb, `Facturation-clubs-${SAISON}.xlsx`);
}

// ======================== ROUTAGE ========================
async function route() {
  if (!PWD || !D) return renderLogin();
  const h = decodeURIComponent(location.hash.slice(1)) || 'recap';
  let m;
  try {
    if ((m = h.match(/^b\/(\d+)(?:\/(.+))?$/))) {
      const b = bord(m[1]); if (!b) { location.hash = 'bordereaux'; return; }
      if (!m[2]) renderBordereau(b);
      else if (m[2] === 'groupe') renderGroupe(b);
      else if (m[2] === 'auto') await renderAuto(b);
      else renderFacture(b, m[2]);
    }
    else if (h === 'bordereaux') renderBordereaux();
    else if (h === 'paiements') renderPaiements();
    else if (h === 'articles') renderArticles();
    else if (h === 'clubs') renderClubs();
    else if (h === 'reglages') renderReglages();
    else renderRecap();
  } catch(e) { fail(e); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { PICK_Q = ''; route(); });
(async () => {
  try { const p = sessionStorage.getItem('fac_admin'); if (p) { PWD = p; await load(); } } catch(e) { PWD = ''; D = null; }
  route();
})();
