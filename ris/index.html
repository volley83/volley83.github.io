<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Signaler une infraction – Comité du Var de Volley-Ball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0B2149; --blue: #1E4FA3; --accent: #F6C21B; --bg: #F4F6FA; --line: #E2E7F0; --text: #14203A; --muted: #56627A;
    --ok: #11672F; --ok-bg: #E7F6EC; --warn: #8A5A00; --warn-bg: #FFF4D6; --bad: #A3231D; --bad-bg: #FCE9E8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  [hidden] { display: none !important; }
  header { background: #fff; border-bottom: 1px solid var(--line); }
  .head { max-width: 720px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .head img { height: 42px; }
  .head .t { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 21px; text-transform: uppercase; color: var(--navy); line-height: 1.05; }
  .head .who { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }
  main { max-width: 720px; margin: 0 auto; padding: 18px 16px 60px; display: flex; flex-direction: column; gap: 16px; }
  h1, h2 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; color: var(--navy); letter-spacing: .5px; }
  h2 { font-size: 22px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 14px; font-weight: 700; }
  .req { color: var(--bad); }
  input, select, textarea { font-family: inherit; font-size: 16px; color: var(--text); background: #fff; border: 1px solid #C9D2E2; border-radius: 10px; padding: 11px 12px; width: 100%; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,79,163,.15); }
  textarea { min-height: 110px; resize: vertical; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .g2 { grid-template-columns: 1fr; } }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; font-weight: 700; font-size: 16px; font-family: inherit; cursor: pointer; }
  .btn.primary { background: var(--navy); color: #fff; } .btn.ghost { background: #fff; border-color: var(--line); color: var(--text); }
  .btn[disabled] { opacity: .5; }
  .msg { border-radius: 10px; padding: 12px 14px; font-size: 15px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.err { background: var(--bad-bg); color: var(--bad); } .msg.info { background: #E9EFFA; color: var(--navy); }
  .small { font-size: 13px; } .muted { color: var(--muted); }
  .linkbtn { background: none; border: 0; color: var(--blue); font-weight: 600; cursor: pointer; font-family: inherit; font-size: 14px; text-decoration: underline; padding: 0; }
  .linkbtn.red { color: var(--bad); }
  .sig { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 3px; }
  .sig:first-child { border-top: 0; padding-top: 0; }
  .inf { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #FAFBFD; display: flex; flex-direction: column; gap: 10px; position: relative; }
  .inf .num { position: absolute; top: -10px; left: 12px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 1px 9px; }
  .inf .x { position: absolute; top: 8px; right: 8px; }
  @media (max-width: 560px) { .inf .g3 { grid-template-columns: 1fr !important; } }
  .badge { display: inline-flex; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .b-new { background: var(--warn-bg); color: var(--warn); } .b-ok { background: var(--ok-bg); color: var(--ok); } .b-no { background: #EEF1F5; color: var(--muted); }
  .chk { display: flex; gap: 8px; align-items: center; font-weight: 500; font-size: 14px; }
  .chk input { width: 18px; height: 18px; }
</style>
</head>
<body>
<header><div class="head"><img src="logo-comite-var.jpg" alt=""><div class="t">Signaler une<br>infraction sportive</div><div class="who" id="who"></div></div></header>
<main id="app"></main>
<script>
const SUPABASE_URL = 'https://nssdhgpvkdbgdewsnlgl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GeMMc45mQbDOq-ZkU5vXZw_lYJe9KXf';
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(fn, args) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
  const txt = await res.text();
  if (!res.ok) { let m = txt; try { m = JSON.parse(txt).message || txt; } catch(e) {} throw new Error(m); }
  return txt ? JSON.parse(txt) : null;
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtD = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const store = { get(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch(e) {} } };
// « PÉNALITÉ RIS N°4 - LICENCE NON PRÉSENTÉE » → « Licence non présentée »
function intitule(des) {
  const t = String(des || '').replace(/^PÉNALITÉ (RIS N°\s*\d+\s*)?-\s*/i, '').replace(/\s*\([^)]*€[^)]*\)\s*$/, '').toLowerCase();
  return (t.charAt(0).toUpperCase() + t.slice(1)).replace(/\bj-(\d+)/g, 'J-$1').replace(/\bm(\d+)/g, 'M$1').replace(/compet'lib/g, "Compet'Lib");
}
// Infractions dont la sanction (forfait ou pénalité) est décidée par le Comité : pas d'article associé
const DECISION = ['Équipe absente', 'Joueur non réglementairement licencié', 'Absence du surclassement requis']
  .flatMap(t => ['Senior', "Compet'Lib", 'Jeunes'].map(c => `${t} – Championnat ${c}`));   // niveau de la rencontre, pas catégorie du joueur
const MARQUEUR = ['Marqueur non réglementairement licencié', 'Marqueur invalide'];
let EDIT = null;   // signalement en cours de modification
let CODE = '', D = null, GARDE = { date: '', match: '' };   // date volontairement vide : à saisir

function renderLogin(err) {
  $('who').textContent = '';
  $('app').innerHTML = `<form class="card" id="lg">
    <h2>Accès réservé</h2>
    <p class="muted">Cette page permet aux personnes habilitées par le Comité du Var de signaler les infractions sportives relevées (feuilles de match, licences, absences…). Saisissez le code personnel qui vous a été transmis.</p>
    <div class="field"><label for="code">Code d'accès</label><input id="code" autocomplete="off" autocapitalize="characters" required style="text-transform:uppercase;letter-spacing:2px;font-weight:700"></div>
    <label class="chk"><input type="checkbox" id="mem" checked> Se souvenir de moi sur cet appareil</label>
    ${err ? `<div class="msg err">${esc(err)}</div>` : ''}
    <button class="btn primary" type="submit">Entrer</button></form>`;
  $('code').focus();
  $('lg').onsubmit = async ev => { ev.preventDefault(); await login($('code').value.trim(), $('mem').checked); };
}
async function login(code, mem) {
  try { D = await rpc('fac_signal_login', { p_code: code }); CODE = code; store.set('ris_code', mem ? code : null); if (location.search) history.replaceState(null, '', location.pathname); render(); }
  catch(e) { store.set('ris_code', null); renderLogin(/code/i.test(e.message) ? 'Code incorrect.' : e.message); }
}
function logout() { store.set('ris_code', null); CODE = ''; D = null; renderLogin(); }

function optionsNature() {
  // engagements et implantations : facturés par le Comité, pas signalés (filtré aussi côté serveur)
  const pen = D.natures.filter(n => n.categorie === 'Pénalités' && !/ENGAGEMENT NON CONFORME|IMPLANTATION/i.test(n.designation));
  return `<option value="">— Choisir —</option>
    <optgroup label="Forfait ou pénalité (décision du Comité)">${DECISION.map(t => `<option value="t:${esc(t)}">${esc(t)}</option>`).join('')}</optgroup>
    ${pen.length ? `<optgroup label="Pénalités">${pen.map(n => `<option value="${n.id}">${esc(intitule(n.designation))}</option>`).join('')}</optgroup>` : ''}
    <optgroup label="Marqueur">${MARQUEUR.map(t => `<option value="t:${esc(t)}">${esc(t)}</option>`).join('')}</optgroup>
    <option value="autre">Autre infraction</option>`;
}
// Demandes de report / de modification au calendrier : précisions de dates dédiées, et proposition d'ajouter l'autre infraction
// Infractions dont la sanction dépend du nombre de joueurs régulièrement qualifiés (perte par pénalité ou forfait)
const besoinNbq = v => /^t:(Joueur non réglementairement licencié|Absence du surclassement requis)/.test(v);
const RE_REPORT = /REPORT DE MATCH/i, RE_MODIF = /MODIFICATION AU CALENDRIER/i;
const natDe = v => D.natures.find(x => String(x.id) === String(v));
const estCalendrier = v => { const n = natDe(v); return !!n && (RE_REPORT.test(n.designation) || RE_MODIF.test(n.designation)); };
const autreCalendrier = v => { const n = natDe(v); if (!n) return null; const re = RE_REPORT.test(n.designation) ? RE_MODIF : RE_REPORT; return D.natures.find(x => re.test(x.designation)) || null; };
const dFr = x => x ? fmtD(x) : '';
const detailsCalendrier = d => { const g = k => d.querySelector(`[data-k=${k}]`).value;
  return [g('dd') && 'Demande du ' + dFr(g('dd')), g('di') && 'date initiale ' + dFr(g('di')), g('dr') && 'nouvelle date ' + dFr(g('dr'))].filter(Boolean).join(' · '); };
const isoDe = t => { const m = String(t || '').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };
function ligneInf(v) {
  const d = document.createElement('div'); d.className = 'inf';
  const prec = [...document.querySelectorAll('.inf [data-k=club]')].pop();
  d.innerHTML = `<span class="num"></span><button type="button" class="linkbtn red x">Retirer</button>
    <div class="field"><label>Club concerné <span class="req">*</span></label><select data-k="club"><option value="">— Choisir —</option>${D.clubs.map(c => `<option value="${esc(c.code)}">${esc(c.code)} – ${esc(c.nom)}</option>`).join('')}</select></div>
    <div class="field"><label>Nature de l'infraction <span class="req">*</span></label><select data-k="nat">${optionsNature()}</select></div>
    <div class="field"><label>Intitulé de l'infraction (publié sur le RIS) <span class="req">*</span></label><input data-k="int" placeholder="Ex. : Licence non présentée – 2 joueuses"><span class="small muted">Pré-rempli selon la nature choisie. Restez général : <b>pas de nom</b> ici.</span></div>
    <div class="field" data-z="det"><label>Précisions : nom du joueur, n° de licence…</label><input data-k="det" placeholder="Ex. : DUPONT Léa, licence 1234567"><span class="small muted">🔒 Transmises au Comité et reprises sur la facture du club, mais <b>jamais publiées sur le RIS</b>.<br>👥 <b>Plusieurs joueurs pour la même infraction sur ce match ?</b> Indiquez-les tous ici, dans une seule infraction (ex. : DUPONT Léa 1234567 ; MARTIN Zoé 7654321).</span></div>
    <div class="field" data-z="cal" hidden><label>Précisions sur la demande <span class="req">*</span></label>
      <div class="g3" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
        <div class="field"><span class="small">Date de la demande</span><input type="date" data-k="dd"></div>
        <div class="field"><span class="small">Date initiale du match</span><input type="date" data-k="di"></div>
        <div class="field"><span class="small">Date de report / nouvelle date</span><input type="date" data-k="dr"></div>
      </div><span class="small muted">🔒 Reprises sur la facture du club, mais <b>jamais publiées sur le RIS</b>.</span></div>
    <div class="field" data-z="nbq" hidden><label>Nombre de joueurs régulièrement qualifiés inscrits sur la feuille de match <span class="req">*</span></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="number" min="0" data-k="nbq" style="width:110px" placeholder="Nombre">
        <select data-k="genre" style="width:auto"><option value="m">joueurs</option><option value="f">joueuses</option></select></div>
      <span class="small muted">Sans compter le ou les joueurs concernés par l'infraction.</span></div>
    <label class="chk" data-z="aussi" hidden style="display:flex;gap:8px;align-items:flex-start;font-size:14.5px"><input type="checkbox" data-k="aussi" style="width:18px;height:18px;margin-top:2px"> <span>Signaler aussi « <b data-z="aussi-nom"></b> » pour cette rencontre (mêmes club, dates et commentaire)</span></label>
    <div class="field"><label>Commentaire sur cette infraction</label><textarea data-k="com" rows="2" placeholder="Circonstances, explications utiles au Comité…"></textarea></div>`;
  const majCal = () => { const nat = d.querySelector('[data-k=nat]').value, cal = estCalendrier(nat), au = cal && autreCalendrier(nat);
    d.querySelector('[data-z=nbq]').hidden = !besoinNbq(nat);
    d.querySelector('[data-z=det]').hidden = cal; d.querySelector('[data-z=cal]').hidden = !cal;
    d.querySelector('[data-z=aussi]').hidden = !au || !!EDIT; if (au) d.querySelector('[data-z=aussi-nom]').textContent = intitule(au.designation); };
  if (prec) d.querySelector('[data-k=club]').value = prec.value;
  if (v) {   // modification : formulaire pré-rempli
    const sel = d.querySelector('[data-k=nat]'), ok = x => [...sel.options].some(o => o.value === x);
    d.querySelector('[data-k=club]').value = v.club || '';
    sel.value = v.article_id && ok(String(v.article_id)) ? String(v.article_id) : ok('t:' + v.nature) ? 't:' + v.nature : 'autre';
    d.querySelector('[data-k=int]').value = v.nature || ''; d.querySelector('[data-k=com]').value = v.commentaire || '';
    d.querySelector('[data-k=nbq]').value = v.nb_qualifies ?? ''; d.querySelector('[data-k=genre]').value = v.nb_genre || 'm';
    if (estCalendrier(sel.value)) { const t = String(v.details || '');
      d.querySelector('[data-k=dd]').value = isoDe((t.match(/Demande du ([\d/]+)/) || [])[1]); d.querySelector('[data-k=di]').value = isoDe((t.match(/date initiale ([\d/]+)/) || [])[1]);
      d.querySelector('[data-k=dr]').value = isoDe((t.match(/nouvelle date ([\d/]+)/) || [])[1]); }
    else d.querySelector('[data-k=det]').value = v.details || '';
  }
  d.querySelector('[data-k=nat]').onchange = e => { const v = e.target.value, n = natDe(v), inp = d.querySelector('[data-k=int]');
    inp.value = n ? intitule(n.designation) : v.startsWith('t:') ? v.slice(2) : ''; majCal(); if (!inp.value) inp.focus(); };
  d.querySelector('.x').onclick = () => { if (document.querySelectorAll('.inf').length > 1) { d.remove(); numeroter(); } };
  $('infs').appendChild(d); majCal(); numeroter(); return d;
}
function numeroter() { const l = document.querySelectorAll('.inf'); l.forEach((d, k) => { d.querySelector('.num').textContent = 'Infraction ' + (k + 1); d.querySelector('.x').hidden = l.length < 2; }); }
function render(okMsg) {
  $('who').innerHTML = `${esc(D.nom)}<br><button class="linkbtn" onclick="logout()">Se déconnecter</button>`;
  const etat = g => g.statut === 'integre' ? '<span class="badge b-ok">Pris en compte</span>' : g.statut === 'rejete' ? '<span class="badge b-no">Non retenu</span>' : '<span class="badge b-new">En attente de validation</span>';
  $('app').innerHTML = `
  ${okMsg ? `<div class="msg ok">${esc(okMsg)}</div>` : ''}
  <form class="card" id="f">
    <h2>${EDIT ? 'Modifier le signalement' : 'Nouveau signalement'}</h2>
    ${EDIT ? '<div class="msg info">Corrigez ce qui doit l\'être puis enregistrez. Le Comité verra directement la version corrigée.</div>' : ''}
    <div class="g2">
      <div class="field"><label for="f-date">Date du match <span class="req">*</span></label><input id="f-date" type="date" value="${esc(EDIT ? EDIT.date_match : GARDE.date)}" max="${today()}" required></div>
      <div class="field"><label for="f-match">N° du match ou tournoi <span class="req">*</span></label><input id="f-match" value="${esc(EDIT ? EDIT.match || '' : GARDE.match)}" placeholder="DFB007, OPEN 2x2 – T1…" required></div>
    </div>
    <p class="small muted" ${EDIT ? 'hidden' : ''}>Vous pouvez signaler <b>plusieurs infractions pour la même rencontre</b> (pour un club ou pour les deux) : ajoutez-les avec le bouton ci-dessous.</p>
    <div id="infs" style="display:flex;flex-direction:column;gap:18px;padding-top:6px"></div>
    <div ${EDIT ? 'hidden' : ''}><button type="button" class="btn ghost" id="f-plus">+ Ajouter une autre infraction sur ce match</button></div>
    <div id="f-err" class="msg err" hidden></div>
    <button class="btn primary" type="submit" id="f-ok">${EDIT ? 'Enregistrer la correction' : 'Envoyer au Comité'}</button>
    ${EDIT ? '<button class="btn ghost" type="button" id="f-annul">Annuler la modification</button>' : ''}
  </form>
  <div class="card"><h2>Mes signalements</h2>
    ${D.mes.length ? D.mes.map(g => `<div class="sig"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(g.club)} · ${esc(g.nature)}</b>${etat(g)}</div>${g.details ? `<span class="small">🔒 ${esc(g.details)}</span>` : ''}${g.nb_qualifies != null ? `<span class="small">${g.nb_qualifies} ${g.nb_genre === 'f' ? 'joueuse(s)' : 'joueur(s)'} régulièrement qualifié(e)s</span>` : ''}
      <span class="small muted">Match ${esc(g.match || '—')} du ${fmtD(g.date_match)} · envoyé le ${fmtD(g.created_at)}</span>
      ${g.commentaire ? `<span class="small">${esc(g.commentaire)}</span>` : ''}
      ${g.statut === 'rejete' && g.motif_rejet ? `<span class="small muted">Motif : ${esc(g.motif_rejet)}</span>` : ''}
      ${g.statut === 'nouveau' ? `<div style="display:flex;gap:16px"><button class="linkbtn" onclick="modifier(${g.id})">Modifier</button><button class="linkbtn red" onclick="suppr(${g.id})">Supprimer ce signalement</button></div>` : ''}</div>`).join('')
    : '<p class="muted">Aucun signalement pour le moment.</p>'}</div>`;
  ligneInf(EDIT);
  if (EDIT) { document.querySelector('.inf .x').hidden = true; $('f-annul').onclick = () => { EDIT = null; render(); }; }
  $('f-plus').onclick = () => ligneInf().querySelector('[data-k=nat]').focus();
  $('f').onsubmit = async ev => {
    ev.preventDefault();
    const err = m => { $('f-err').textContent = m; $('f-err').hidden = false; };
    const date_match = $('f-date').value, match = $('f-match').value.trim(), rows = [...document.querySelectorAll('.inf')];
    if (!date_match) return err('Indiquez la date du match.');
    if (!match) return err('Indiquez le n° du match ou du tournoi.');
    const ps = [];
    for (const [k, d] of rows.entries()) {
      const g = x => d.querySelector(`[data-k=${x}]`).value.trim(), nat = g('nat'), cal = estCalendrier(nat);
      const p = { date_match, match, club: g('club'), article_id: /^\d+$/.test(nat) ? nat : null, nature: g('int'), details: cal ? detailsCalendrier(d) : g('det'), commentaire: g('com'), _row: k,
        nb_qualifies: besoinNbq(nat) ? g('nbq') : '', nb_genre: besoinNbq(nat) ? g('genre') : '' };
      if (!p.club) return err(`Infraction ${k + 1} : choisissez le club concerné.`);
      if (!p.nature) return err(`Infraction ${k + 1} : choisissez ou précisez l'infraction.`);
      if (besoinNbq(nat) && g('nbq') === '') return err(`Infraction ${k + 1} : indiquez le nombre de joueurs régulièrement qualifiés inscrits sur la feuille de match.`);
      if (cal && (!g('dd') || !g('di'))) return err(`Infraction ${k + 1} : indiquez au moins la date de la demande et la date initiale du match.`);
      ps.push(p);
      const au = cal && !EDIT && d.querySelector('[data-k=aussi]').checked && autreCalendrier(nat);
      if (au) ps.push({ ...p, article_id: au.id, nature: intitule(au.designation) });
    }
    $('f-ok').disabled = true;
    if (EDIT) {
      const { _row, ...p0 } = ps[0];
      try { await rpc('fac_signal_modifier', { p_code: CODE, p_id: EDIT.id, p: p0 }); EDIT = null; D = await rpc('fac_signal_login', { p_code: CODE });
        render('✓ Signalement corrigé.'); window.scrollTo(0, 0); }
      catch(e) { $('f-ok').disabled = false; err(e.message); }
      return;
    }
    let n = 0;
    try { for (const { _row, ...p } of ps) { await rpc('fac_signal_envoyer', { p_code: CODE, p }); n++; }
      GARDE = { date: date_match, match }; D = await rpc('fac_signal_login', { p_code: CODE });
      render(n > 1 ? `✓ ${n} infractions envoyées au Comité.` : '✓ Signalement envoyé au Comité. Vous pouvez en saisir un autre pour le même match.'); window.scrollTo(0, 0); }
    catch(e) { $('f-ok').disabled = false; err((n ? `${n} infraction(s) envoyée(s), mais la suivante a échoué : ` : '') + e.message);
      if (n) { const fini = new Set(ps.slice(0, n).map(p => p._row)); if (n < ps.length && ps[n]._row === ps[n - 1]._row) fini.delete(ps[n]._row);
        rows.forEach((d, k) => { if (fini.has(k)) d.remove(); }); numeroter(); } }
  };
}
function modifier(id) {
  EDIT = D.mes.find(g => g.id === id) || null; render(); window.scrollTo(0, 0);
}
