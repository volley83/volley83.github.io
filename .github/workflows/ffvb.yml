name: Championnats FFvolley - mise à jour
# Récupère calendriers, résultats et classements sur le site FFvolley
# et met à jour championnats/data/ffvb.json (lu par la page Championnats).
on:
  schedule:
    - cron: '23 */2 * * *'          # toutes les 2 heures
    - cron: '53 11-22 * * 0,6'      # en plus, toutes les heures le week-end (heure UTC)
  workflow_dispatch:                # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
concurrency:
  group: ffvb
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Récupérer les données FFvolley
        run: python3 scripts/ffvb.py
      - name: Enregistrer si quelque chose a changé
        run: |
          if [ -n "$(git status --porcelain championnats/data)" ]; then
            git config user.name "volley83"
            git config user.email "volley83@users.noreply.github.com"
            git add championnats/data
            git commit -m "Championnats : mise à jour des résultats FFvolley"
            git pull --rebase -q && git push
          else
            echo "Pas de changement"
          fi
