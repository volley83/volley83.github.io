name: FFVB - sonde (pages brutes)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer quelques pages FFVB
        run: |
          mkdir raw && cd raw
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" "https://www.ffvbbeach.org/ffvbapp/resu/vbspo_home.php?codent=PTCA83" -o home.html
          for p in CFA DFA M4A PFD BFA MFA CMC; do
            curl -sSL -A "$UA" "https://www.ffvbbeach.org/ffvbapp/resu/vbspo_calendrier.php?saison=2026%2F2027&codent=PTCA83&poule=$p" -o cal_$p.html
          done
          ls -la
          file *
      - name: Publier sur la branche ffvb-raw
        run: |
          cd raw
          git init -q -b ffvb-raw
          git config user.name "volley83" && git config user.email "volley83@users.noreply.github.com"
          git add . && git commit -qm "pages brutes FFVB"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ffvb-raw
